<style>
  html, body { font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: #f7f7f5; color: #1f2937; margin: 0; }
  button { touch-action: manipulation; cursor: pointer; }
  button:disabled { cursor: default; }

  /* 3D tlačítka ve stylu Duolingo */
  .btn3d { box-shadow: 0 4px 0 var(--shadow, #e5e5e5); transition: transform .08s ease, box-shadow .08s ease, filter .15s, background-color .15s; -webkit-user-select: none; user-select: none; }
  .btn3d:not(:disabled):hover { filter: brightness(1.04); }
  .btn3d:not(:disabled):active { transform: translateY(4px); box-shadow: 0 0 0 var(--shadow, #e5e5e5); }

  .ans:focus { border-color: var(--focus, #3b82f6); outline: none; }
  .blank { display: inline-block; min-width: 1.8em; padding: 0 .15em; margin: 0 .1em; border-bottom: 4px solid #d1d5db; color: #9ca3af; text-align: center; line-height: 1.1; }
  .lined { background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 58px, #e5e7eb 58px, #e5e7eb 60px); }

  .bubble::before { content: ''; position: absolute; left: -9px; top: 50%; width: 16px; height: 16px; background: #fff; border-left: 2px solid #e5e7eb; border-bottom: 2px solid #e5e7eb; transform: translateY(-50%) rotate(45deg); }

  @keyframes shake { 0%,100% { transform: translateX(0) } 20% { transform: translateX(-9px) } 40% { transform: translateX(9px) } 60% { transform: translateX(-5px) } 80% { transform: translateX(5px) } }
  .shake { animation: shake .4s ease; }
  @keyframes pop { 0% { transform: scale(.88); opacity: 0 } 70% { transform: scale(1.02); opacity: 1 } 100% { transform: scale(1) } }
  .pop { animation: pop .3s ease-out both; }
  @keyframes sheet { from { transform: translateY(100%) } to { transform: translateY(0) } }
  .sheet { animation: sheet .25s ease-out; }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  .fade { animation: fade .2s ease-out; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-4deg) } 50% { transform: translateY(-6px) rotate(4deg) } }
  .bob { display: inline-block; animation: bob 2.4s ease-in-out infinite; }
  @keyframes wiggle { 0%,100% { transform: rotate(0) } 25% { transform: rotate(-12deg) } 75% { transform: rotate(12deg) } }
  .wiggle { display: inline-block; animation: wiggle .6s ease-in-out 2; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  .confetti { position: fixed; top: -20px; width: 10px; height: 14px; border-radius: 2px; z-index: 60; pointer-events: none; animation: fall linear forwards; }

  /* přetahování (dvojice, doplňování vět) */
  .dnd { touch-action: pan-y; -webkit-user-select: none; user-select: none; }
  .dnd-ghost { position: fixed; z-index: 70; pointer-events: none; opacity: .92; transform: translate(-50%, -50%) scale(1.06); box-shadow: 0 10px 24px rgba(0,0,0,.22); }
  .dnd-src { opacity: .35; }
  .dnd-over { outline: 3px solid #38bdf8; outline-offset: 2px; }

  /* doplňování slov do věty */
  .fill-text { font-size: 1.35rem; line-height: 3.1rem; font-weight: 700; color: #1f2937; }
  @media (min-width: 640px) { .fill-text { font-size: 1.6rem; line-height: 3.4rem; } }
  .slot { display: inline-flex; align-items: center; justify-content: center; vertical-align: middle; min-width: 96px; min-height: 44px; padding: 2px 12px; margin: 0 4px;
          border-radius: 12px; border: 2px dashed #cbd5e1; background: #f8fafc; color: #94a3b8; font-weight: 800; transition: background-color .15s, border-color .15s; }
  .slot.filled { border-style: solid; border-color: #e5e7eb; background: #fff; color: #1f2937; box-shadow: 0 3px 0 #e5e7eb; }
  .slot.active { border-color: #38bdf8; background: #f0f9ff; }
  .slot.ok { border-style: solid; border-color: #22c55e; background: #dcfce7; color: #166534; box-shadow: 0 3px 0 #86efac; }
  .slot.bad { border-style: solid; border-color: #f87171; background: #fef2f2; color: #dc2626; }
  .slot.reveal { border-style: solid; border-color: #f87171; background: #fff; color: #166534; }

  /* mapa */
  .map-card { background: #fff; border: 2px solid #e5e7eb; border-radius: 1.5rem; padding: .5rem; }
  .cz-map { display: block; width: 100%; height: auto; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  .cz-map .reg { fill: #dbe4ee; stroke: #fff; stroke-width: 1.8; stroke-linejoin: round; fill-rule: evenodd; transition: fill .15s; }
  .cz-map .reg.click { cursor: pointer; }
  .cz-map .reg.click:hover { fill: #bae6fd; }
  .cz-map .reg.hl { fill: #fbbf24; }
  .cz-map .reg.ok { fill: #86efac; }
  .cz-map .reg.bad { fill: #fca5a5; }
  .cz-map .river { fill: none; stroke: #38bdf8; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  .cz-map .river.hl { stroke: #f59e0b; stroke-width: 4.5; }
  .cz-map .river.ok { stroke: #22c55e; stroke-width: 4.5; }
  .cz-map .river.bad { stroke: #ef4444; stroke-width: 4.5; }
  .cz-map .river.dim { opacity: .45; }
  .cz-map .rhit { fill: none; stroke: transparent; stroke-width: 20; pointer-events: stroke; cursor: pointer; }
  .cz-map .rgrp { cursor: pointer; }
  .cz-map .rgrp:hover .river { stroke: #0284c7; stroke-width: 4.2; }
  .cz-map .pt { fill: #334155; stroke: #fff; stroke-width: 2; }
  .cz-map .pt.peak { fill: #b45309; }
  .cz-map .pt.range { fill: #7c3aed; }
  .cz-map .pt.hl { fill: #f59e0b; stroke: #92400e; }
  .cz-map .pt.ok { fill: #22c55e; stroke: #166534; }
  .cz-map .pt.bad { fill: #ef4444; stroke: #7f1d1d; }
  .cz-map .pgrp { cursor: pointer; }
  .cz-map .phit { fill: transparent; }
  .cz-map .pgrp:hover .pt { stroke: #0284c7; stroke-width: 3; }
  .cz-map .lbl { font: 800 12.5px ui-rounded, "Segoe UI", system-ui, sans-serif; fill: #1f2937; paint-order: stroke; stroke: #fff; stroke-width: 3.5px; stroke-linejoin: round; text-anchor: middle; pointer-events: none; }
  .cz-map .lbl.sm { font-size: 11px; }
  .cz-map .lbl.rv { fill: #0369a1; }
  .map-legend { font-size: .8rem; font-weight: 700; color: #9ca3af; text-align: center; margin-top: .25rem; }
  @media (max-width: 639px) {   /* na telefonu je mapa zmenšená, tak řeky, popisky a čáry zesílíme */
    .cz-map .reg { stroke-width: 2.6; }
    .cz-map .river { stroke-width: 4.8; }
    .cz-map .river.hl, .cz-map .river.ok, .cz-map .river.bad, .cz-map .rgrp:hover .river { stroke-width: 7.5; }
    .cz-map .rhit { stroke-width: 36; }
    .cz-map .lbl.sm { font-size: 17px; stroke-width: 5px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .shake, .pop, .sheet, .fade, .bob, .wiggle, .confetti { animation: none !important; }
  }
</style>

<!--
  ============================================================
  OTÁZKY (JSON)
  ============================================================
  Typy cvičení ("type"):
    abcd   – výběr z možností: "options": [...], "correct": "..."
    input  – napiš odpověď: "correct": "..." nebo ["...", "..."] (víc uznávaných odpovědí)
    pairs  – spoj dvojice: "pairs": [["bed", "postel"], ["sofa", "pohovka"], ...]  (2–8 dvojic)
    order  – slož z dílků: "correct": "I sleep in my bed"  (dílky = slova)
             pro písmena: "joiner": ""  → "correct": "bydlet" se rozdělí na písmena
             vlastní oddělovač: "joiner": " → " → "correct": "A → B → C"
             "extra": ["are"] = navíc špatné dílky na zmatení
    tip    – výuková karta (mnemotechnika), ukáže se na začátku tématu: "question" = nadpis, "text" = výklad
    fill   – doplň slova do věty: "text": "Řeka {{Vltava}} teče přes {{Prahu}}.", "extra": ["Labe"] = navíc špatná slova
             {{správně|špatná1|špatná2}} = špatná slova jen pro toto místo. Slova se dají kliknout nebo přetáhnout.
    map    – slepá mapa, klikni na správné místo: "map": "cr" (soubor data/maps/cr.json),
             "layer": "regions" | "rivers" | "points", "target": "jihocesky" (id; nebo seznam),
             "candidates": [...] = které řeky/body se na mapě zobrazí (jinak všechny stejného druhu)

  Mapa jde přidat i k ostatním typům (abcd, input, fill, tip):
    map        – název mapy, např. "cr"
    highlight  – co zvýraznit: ["regions:jihocesky", "rivers:vltava", "points:brno"]
    show       – co ještě zobrazit: ["rivers:labe", "points:snezka"] (jinak jen zvýrazněné)
    labels     – true = popisky názvů krajů (hodí se u typu tip)
  Mapy jsou v data/maps/*.json (kraje, řeky a body se jmény) – stačí přidat soubor a odkázat se na něj přes "map".

  Další pole:
    id          – unikátní; prefix cj_/cz_, aj_/en_, m_/ma_, prv_ určí předmět, pokud chybí "subject"
    subject     – "cj" | "aj" | "m" | "prv"
    topic       – název tématu (tlačítko v menu předmětu)
    question    – zadání. **tučně**, ___ = mezera k doplnění, \n = nový řádek
    hint        – nápověda (na požádání nebo po první chybě)
    explanation – vysvětlení po vyřešení
    emoji       – obrázek z emoji (funguje offline)
    imageUrl    – obrázek z webu nebo z repozitáře ("img/kuchyne.jpg"); bez internetu se nahradí emoji
    code        – blok s pevným písmem (písemné násobení)
    unit        – jednotka za políčkem ("Kč")
    say         – co přečíst nahlas tlačítkem 🔊
    added       – datum přidání "2026-10-26" (novější sady mají přednost)

  Nové sady nemusíš psát sem – stačí soubor questions.json vedle index.html (viz Rodičovský panel → Otázky).
-->

<script>
'use strict';

/* ============================================================
   KONFIGURACE
   ============================================================ */
const SUBJECTS = {
  cj:  { name: 'Český jazyk',        emoji: '📖', color: '#ef4444', dark: '#b91c1c', lang: 'cs-CZ' },
  aj:  { name: 'Anglický jazyk',     emoji: '💂', color: '#3b82f6', dark: '#1d4ed8', lang: 'en-GB' },
  m:   { name: 'Matematika',         emoji: '🧮', color: '#f97316', dark: '#c2410c', lang: 'cs-CZ' },
  prv: { name: 'Člověk a jeho svět', emoji: '🌍', color: '#22c55e', dark: '#15803d', lang: 'cs-CZ' },
};
const SUBJECT_ALIASES = {
  cj: 'cj', cz: 'cj', cs: 'cj', cesky: 'cj', cestina: 'cj', 'cesky jazyk': 'cj',
  aj: 'aj', en: 'aj', eng: 'aj', anglictina: 'aj', 'anglicky jazyk': 'aj',
  m: 'm', ma: 'm', mat: 'm', math: 'm', matematika: 'm',
  prv: 'prv', cjs: 'prv', svet: 'prv', clovek: 'prv', 'clovek a jeho svet': 'prv',
};
const TYPES = ['abcd', 'input', 'pairs', 'order', 'fill', 'map', 'tip'];
const LAYERS = ['regions', 'rivers', 'points'];
const BASE_PACKS = ['data/kraje-cr.json'];   // sady, které se načtou vždy (nezávisle na questions.json)
const JOKE_BLOCK = 10;                       // vtip je za celý blok aspoň tolika úkolů…
const JOKE_RATIO = 0.9;                      // …když z nich aspoň 90 % vyšlo napoprvé (9 z 10)
const GREEN = '#58cc02', GREEN_DARK = '#46a302';
const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];
const MAX_TRIES = 3;                     // po kolika chybách u psaní / skládání ukázat správnou odpověď
const KEY = { stats: 'ucime_stats_v1', settings: 'ucime_settings_v1', custom: 'ucime_custom_questions_v1', jokes: 'ucime_jokes_seen_v1' };
const PRAISE = ['Výborně!', 'Paráda!', 'Super!', 'Přesně tak!', 'Jsi borec!', 'Skvěle!', 'Bomba!', 'Trefa!', 'Jedničková odpověď!'];
const AFTER_FIX = ['Správně! Příště napoprvé 😉', 'Tak je to! Vytrvalost se vyplácí 💪', 'Ano! Nevzdat se je základ.', 'Správně! Opravit chybu je taky umění.'];
const TRY_AGAIN = ['Ještě jednou! 🙂', 'Skoro! Zkus to jinak.', 'Nevadí, zkus to znovu.', 'Hmm, tohle ne. Další pokus!'];
const DATE_RE = /(\d{4}-\d{2}-\d{2})/;

/* ============================================================
   ÚLOŽIŠTĚ
   ============================================================ */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* plné nebo zakázané úložiště */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
let settings = Object.assign({ sessionLength: 10, sound: true, jokes: true }, store.get(KEY.settings, {}));
if (store.get(KEY.settings, {}).jokeEvery === 0 && store.get(KEY.settings, {}).jokes === undefined) settings.jokes = false; // starší nastavení "vtipy vypnuty"
delete settings.jokeEvery;
const saveSettings = () => store.set(KEY.settings, settings);

function loadStats() {
  const s = store.get(KEY.stats, null) || {};
  return { timeBySubject: s.timeBySubject || {}, sessions: s.sessions || [], questions: s.questions || {} };
}
let stats = loadStats();
const saveStats = () => store.set(KEY.stats, stats);

/* ============================================================
   STAV APLIKACE
   ============================================================ */
let QUESTIONS = [], JOKES = [], MAPS = {};
let SOURCES = { builtin: 0, files: [], imported: 0, maps: [], warnings: [] };
let screen = 'loading', lastScreen = null, currentSubject = null, game = null, modal = null, parentMsg = null;
const $app = document.getElementById('app');

/* ============================================================
   POMOCNÉ FUNKCE
   ============================================================ */
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const rich = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/_+/g, '<span class="blank">?</span>').replace(/\n/g, '<br>');
const plain = s => String(s ?? '').replace(/\*\*/g, '').replace(/_+/g, '…');
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function shuffle(a) { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
const plural = (n, one, few, many) => n === 1 ? one : (n >= 2 && n <= 4 ? few : many);
const fmtClock = sec => `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
function fmtDur(sec) {
  sec = Math.round(sec || 0);
  if (sec < 60) return `${sec} s`;
  const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
  return h ? `${h} h ${m} min` : `${m} min`;
}
const dayKey = ts => { const d = new Date(ts); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const deaccent = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const isMistake = q => { const st = stats.questions[q.id]; return !!(st && st.lastOk === false); };
const isMastered = q => { const st = stats.questions[q.id]; return !!(st && st.lastOk); };
const isNewQ = q => (q._rank || 0) > 0 && !stats.questions[q.id];        // z JSON sady a ještě neviděná
const newKey = q => `${q._added || ''}|${String(q._rank || 0).padStart(4, '0')}`; // větší = novější

/* ============================================================
   NAČÍTÁNÍ A KONTROLA OTÁZEK
   ============================================================ */
function subjectOf(q) {
  const s = deaccent(q.subject || '').toLowerCase().trim();
  if (SUBJECT_ALIASES[s]) return SUBJECT_ALIASES[s];
  const prefix = String(q.id || '').split(/[_-]/)[0].toLowerCase();
  return SUBJECT_ALIASES[prefix] || null;
}

function splitTiles(text, joiner) {
  return joiner === '' ? [...String(text)] : String(text).split(joiner).map(t => t.trim()).filter(Boolean);
}

function normalizeQuestion(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const q = Object.assign({}, raw);
  q.subject = subjectOf(raw);
  if (!q.subject || !q.id) return null;
  q.id = String(q.id);
  q.type = String(q.type || (Array.isArray(q.pairs) ? 'pairs' : Array.isArray(q.options) ? 'abcd' : 'input')).toLowerCase();
  if (!TYPES.includes(q.type)) return null;
  q.topic = q.topic ? String(q.topic) : 'Ostatní';
  if (!q.question) q.question = q.type === 'pairs' ? 'Spoj, co k sobě patří:' : q.type === 'order' ? 'Slož ve správném pořadí:'
    : q.type === 'fill' ? 'Doplň slova do věty:' : q.type === 'map' ? 'Klikni na správné místo na mapě:' : '';
  if (!q.question) return null;

  // mapa (nepovinná u všech typů, povinná u "map")
  q.map = q.map ? String(q.map).trim() : '';
  if (q.map && !/^[\w-]+$/.test(q.map)) return null;
  const refs = v => (Array.isArray(v) ? v : v ? [v] : []).map(String).filter(x => /^(regions|rivers|points):[^:]+$/.test(x));
  if (q.map) { q.highlight = refs(q.highlight); q.show = refs(q.show); q.labels = !!q.labels; }
  else { delete q.map; delete q.highlight; delete q.show; delete q.labels; }
  if (q.type === 'tip') return q;

  if (q.type === 'map') {
    if (!q.map) return null;
    q.layer = LAYERS.includes(q.layer) ? q.layer : 'regions';
    q.target = (Array.isArray(q.target) ? q.target : [q.target]).filter(x => x != null && x !== '').map(String);
    if (!q.target.length) return null;
    q.candidates = Array.isArray(q.candidates) && q.candidates.length ? q.candidates.map(String) : null;
    return q;
  }

  if (q.type === 'fill') {
    const src = String(q.text || ''), re = /\{\{(.+?)\}\}/g;
    q.parts = []; q.blanks = [];
    let last = 0, m;
    while ((m = re.exec(src))) {
      const [answer, ...bad] = m[1].split('|').map(s => s.trim());
      if (!answer) return null;
      q.parts.push(src.slice(last, m.index));
      q.blanks.push({ answer, bad: bad.filter(Boolean) });
      last = m.index + m[0].length;
    }
    q.parts.push(src.slice(last));
    q.extra = Array.isArray(q.extra) ? q.extra.map(String) : [];
    return q.blanks.length ? q : null;
  }

  if (q.type === 'pairs') {
    if (!Array.isArray(q.pairs)) return null;
    q.pairs = q.pairs.map(p => Array.isArray(p) ? [p[0], p[1]] : (p && typeof p === 'object') ? [p.left ?? p.a, p.right ?? p.b] : null)
      .filter(p => p && p[0] != null && p[1] != null && String(p[0]) !== '' && String(p[1]) !== '')
      .map(p => [String(p[0]), String(p[1])]).slice(0, 8);
    return q.pairs.length >= 2 ? q : null;
  }

  if (q.type === 'order') {
    q.joiner = q.joiner === undefined ? ' ' : String(q.joiner);
    if ((q.correct === undefined || q.correct === '') && Array.isArray(q.words)) q.correct = q.words.join(q.joiner);
    if (q.correct === undefined || q.correct === null || q.correct === '') return null;
    q.correct = (Array.isArray(q.correct) ? q.correct : [q.correct]).map(String);
    q.words = Array.isArray(q.words) ? q.words.map(String) : splitTiles(q.correct[0], q.joiner);
    q.extra = Array.isArray(q.extra) ? q.extra.map(String) : [];
    return q.words.length >= 2 ? q : null;
  }

  if (q.correct === undefined || q.correct === null || q.correct === '') return null;
  if (q.type === 'abcd') {
    if (!Array.isArray(q.options) || q.options.length < 2) return null;
    q.options = q.options.map(String);
    q.correct = String(Array.isArray(q.correct) ? q.correct[0] : q.correct);
    if (!q.options.includes(q.correct)) return null;
  } else {
    q.correct = (Array.isArray(q.correct) ? q.correct : [q.correct]).map(String);
  }
  return q;
}

function parseQuestionPack(json) {
  let arr, replace = false;
  if (Array.isArray(json)) arr = json;
  else if (json && typeof json === 'object') { arr = Array.isArray(json.questions) ? json.questions : []; replace = !!json.replaceBuiltIn; }
  else return { questions: [], replace: false, errors: 1 };
  const out = []; let errors = 0;
  for (const r of arr) { const q = normalizeQuestion(r); if (q) out.push(q); else errors++; }
  return { questions: out, replace, errors };
}

function stampPack(questions, rank, added) {
  questions.forEach(q => { q._rank = rank; q._added = String(q.added || added || ''); });
}
function addJokes(json) {
  if (!json || !Array.isArray(json.jokes)) return;
  const add = (q, a) => { if (q && !JOKES.some(j => j.q === q)) JOKES.push({ q, a }); };   // stejný vtip se nepřidá dvakrát
  json.jokes.forEach(j => {
    if (typeof j === 'string') add(j.trim(), '');
    else if (j && j.q) add(String(j.q), j.a ? String(j.a) : '');
  });
}
async function fetchJson(path) {
  const r = await fetch(path, { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function loadQuestions() {
  const builtin = parseQuestionPack(JSON.parse(document.getElementById('question-data').textContent));
  stampPack(builtin.questions, 0, '');
  try { JOKES = JSON.parse(document.getElementById('joke-data').textContent).filter(j => j && j.q); } catch (e) { JOKES = []; }
  SOURCES = { builtin: 0, files: [], imported: 0, maps: [], warnings: [] };
  const packs = [], embeddedMaps = {};
  const takeMaps = j => { if (j && j.maps && typeof j.maps === 'object' && !Array.isArray(j.maps)) Object.assign(embeddedMaps, j.maps); };

  // 1) sady z data/ (součást aplikace) a questions.json vedle index.html (+ soubory ze seznamu "files")
  //    – funguje na webu, ne při otevření ze souboru
  if (/^https?:$/.test(location.protocol)) {
    const base = await Promise.all(BASE_PACKS.map(f => fetchJson(f).then(j => ({ f, j }), () => ({ f, j: null }))));
    base.forEach(({ f, j }) => {
      if (!j) { SOURCES.files.push({ name: f, count: 0, missing: true }); return; }
      const bp = parseQuestionPack(j);
      stampPack(bp.questions, 1, (j && j.added) || ((f.match(DATE_RE) || [])[1]) || '');
      packs.push(bp); addJokes(j); takeMaps(j);
      SOURCES.files.push({ name: f, count: bp.questions.length, errors: bp.errors });
    });

    let main = null;
    try { main = await fetchJson('questions.json'); } catch (e) { /* soubor neexistuje – nevadí */ }
    if (main) {
      const p = parseQuestionPack(main);
      stampPack(p.questions, 1, (main && main.added) || '');
      packs.push(p); addJokes(main); takeMaps(main);
      if (p.questions.length || !Array.isArray(main.files)) SOURCES.files.push({ name: 'questions.json', count: p.questions.length, errors: p.errors });
      const files = Array.isArray(main.files) ? main.files.map(String) : [];
      const loaded = await Promise.all(files.map(f => fetchJson(f).then(j => ({ f, j }), () => ({ f, j: null }))));
      loaded.forEach(({ f, j }, i) => {
        if (!j) { SOURCES.files.push({ name: f, count: 0, missing: true }); return; }
        const fp = parseQuestionPack(j);
        stampPack(fp.questions, i + 2, (j && j.added) || ((f.match(DATE_RE) || [])[1]) || '');
        packs.push(fp); addJokes(j); takeMaps(j);
        SOURCES.files.push({ name: f, count: fp.questions.length, errors: fp.errors });
      });
    }
  }
  // 2) otázky importované v rodičovském panelu (uložené v prohlížeči)
  const custom = store.get(KEY.custom, null);
  if (custom) {
    const p = parseQuestionPack(custom);
    stampPack(p.questions, 1000, '');
    SOURCES.imported = p.questions.length; packs.push(p); addJokes(custom); takeMaps(custom);
  }

  const map = new Map();
  const replace = packs.some(p => p.replace);
  if (!replace) builtin.questions.forEach(q => map.set(q.id, q));
  SOURCES.builtin = replace ? 0 : builtin.questions.length;
  packs.forEach(p => p.questions.forEach(q => map.set(q.id, q)));
  QUESTIONS = [...map.values()];
  await loadMaps(embeddedMaps);
}

/* Mapy: z pole "maps" v sadě, jinak data/maps/<název>.json. Otázky s chybějící mapou nebo odkazem se vyřadí (a ukážou v rodičovském panelu). */
function normalizeMap(m) {
  if (!m || typeof m !== 'object') return null;
  const obj = v => (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};
  const out = { viewBox: /^[\d.\s-]+$/.test(m.viewBox || '') ? m.viewBox : '0 0 800 460', name: m.name || '', regions: obj(m.regions), rivers: obj(m.rivers), points: obj(m.points) };
  return Object.keys(out.regions).length + Object.keys(out.rivers).length + Object.keys(out.points).length ? out : null;
}
async function loadMaps(embedded) {
  MAPS = {};
  const names = [...new Set(QUESTIONS.map(q => q.map).filter(Boolean))];
  await Promise.all(names.map(async n => {
    let m = embedded[n] || null;
    if (!m && /^https?:$/.test(location.protocol)) { try { m = await fetchJson(`data/maps/${n}.json`); } catch (e) { /* mapa neexistuje */ } }
    const nm = normalizeMap(m);
    if (nm) MAPS[n] = nm;
    SOURCES.maps.push({ name: n, ok: !!nm });
  }));
  QUESTIONS = QUESTIONS.filter(q => {
    const why = mapProblem(q);
    if (why) SOURCES.warnings.push(`${q.id}: ${why}`);
    return !why;
  });
}
function mapProblem(q) {
  if (!q.map) return '';
  const m = MAPS[q.map];
  if (!m) return `chybí mapa "${q.map}"`;
  for (const ref of [...q.highlight, ...q.show]) {
    const [layer, id] = ref.split(':');
    if (!m[layer][id]) return `na mapě není ${ref}`;
  }
  if (q.type === 'map') {
    if (q.target.some(t => !m[q.layer][t])) return `cíl ${q.target.join(', ')} není na mapě (${q.layer})`;
    if (q.candidates && q.candidates.some(c => !m[q.layer][c])) return `neznámý kandidát na mapě (${q.layer})`;
  }
  return '';
}

/* Témata seřazená od nejnovějších (podle data "added" a pořadí souborů) */
function getTopics(subject) {
  const topics = [], byName = {};
  QUESTIONS.filter(q => q.subject === subject && q.type !== 'tip').forEach(q => {
    if (!byName[q.topic]) { byName[q.topic] = { name: q.topic, qs: [], key: '' }; topics.push(byName[q.topic]); }
    const t = byName[q.topic]; t.qs.push(q);
    if (newKey(q) > t.key) t.key = newKey(q);
  });
  return topics.sort((a, b) => b.key.localeCompare(a.key));
}

/* ============================================================
   ZVUKY (Web Audio – bez souborů, funguje offline)
   ============================================================ */
let actx = null;
function unlockAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) {}
}
function tone(freqs, dur = 0.12, type = 'sine', gap = 0.09, vol = 0.15) {
  if (!settings.sound) return;
  try {
    unlockAudio(); if (!actx) return;
    const t = actx.currentTime;
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), st = t + i * gap;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, st);
      g.gain.exponentialRampToValueAtTime(vol, st + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, st + dur);
      o.connect(g).connect(actx.destination);
      o.start(st); o.stop(st + dur + 0.03);
    });
  } catch (e) {}
}
const sfx = {
  correct: () => tone([660, 880, 1175], 0.14, 'triangle', 0.08, 0.16),
  wrong:   () => { tone([196, 165], 0.18, 'square', 0.11, 0.05); try { navigator.vibrate && navigator.vibrate(80); } catch (e) {} },
  finish:  () => tone([523, 659, 784, 1047, 1319], 0.22, 'triangle', 0.11, 0.16),
  tip:     () => tone([523, 784], 0.1, 'sine', 0.07, 0.08),
  match:   () => tone([784, 1047], 0.09, 'triangle', 0.06, 0.12),
  tick:    () => tone([600], 0.04, 'sine', 0, 0.05),
  reward:  () => tone([784, 988, 1175, 1568], 0.16, 'triangle', 0.09, 0.15),
};

/* Předčítání (angličtina) */
const canSpeak = 'speechSynthesis' in window;
function speakTextFor(q) {
  if (!canSpeak || q.type === 'tip') return '';
  if (typeof q.say === 'string') return q.say;
  if (q.type !== 'abcd' && q.type !== 'input') return '';
  if (q.subject === 'aj' && !/[ěščřžýáíéůúňťďó„“]/i.test(q.question)) return plain(q.question).replace(/…/g, ' ... ');
  return '';
}
function speak(text, lang) {
  if (!canSpeak || !text) return;
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang; u.rate = 0.85;
    const voices = speechSynthesis.getVoices();
    const norm = v => (v.lang || '').replace('_', '-').toLowerCase();
    const v = voices.find(v => norm(v) === lang.toLowerCase()) || voices.find(v => norm(v).startsWith(lang.slice(0, 2).toLowerCase()));
    if (v) u.voice = v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}

/* Vtipy – bez opakování, dokud se neprojdou všechny */
function nextJoke() {
  if (!JOKES.length) return null;
  let seen = store.get(KEY.jokes, []);
  let avail = JOKES.filter(j => !seen.includes(j.q));
  if (!avail.length) { seen = []; avail = JOKES.slice(); }
  const j = pick(avail);
  seen.push(j.q); store.set(KEY.jokes, seen);
  return j;
}

/* ============================================================
   STATISTIKY
   ============================================================ */
function questionLabel(q) {
  let t = plain(q.question).replace(/\n/g, ' ');
  if (q.type === 'pairs') t += ' (' + q.pairs.map(p => p[0]).join(', ') + ')';
  if (q.type === 'fill') t += ' ' + q.parts.map(plain).join('…').replace(/\s+/g, ' ');
  if (q.code) t += ' ' + q.code.replace(/\s+/g, ' ').replace(/[─]+/g, '').trim();
  return t.slice(0, 160);
}
function recordAnswer(q, wrongAnswers, revealed) {
  const s = stats.questions[q.id] || (stats.questions[q.id] = { seen: 0, firstTry: 0, fails: 0, wrong: 0 });
  const ok = wrongAnswers.length === 0 && !revealed;
  s.seen++; s.wrong += wrongAnswers.length;
  if (ok) s.firstTry++; else { s.fails++; s.lastFail = Date.now(); s.lastWrong = wrongAnswers.slice(-3); }
  s.lastOk = ok; s.last = Date.now();
  s.q = questionLabel(q); s.subject = q.subject; s.topic = q.topic; s.type = q.type;
  saveStats();
}
function resumeClock() { if (game && !game.ended && game.runningSince == null) game.runningSince = performance.now(); }
function pauseClock() { if (game && game.runningSince != null) { game.activeMs += performance.now() - game.runningSince; game.runningSince = null; } }
function endSession(completed) {
  if (!game || game.ended) return;
  pauseClock(); game.ended = true;
  const sec = Math.round(game.activeMs / 1000);
  stats.timeBySubject[game.subject] = (stats.timeBySubject[game.subject] || 0) + sec;
  if (game.results.length > 0 || sec >= 10) {
    stats.sessions.push({
      ts: game.startTs, subject: game.subject, topic: game.topicLabel, sec,
      total: game.total, answered: game.results.length, firstTry: game.results.filter(r => r.first).length, completed,
    });
    if (stats.sessions.length > 300) stats.sessions = stats.sessions.slice(-300);
  }
  saveStats();
}
function dayStreak() {
  const days = new Set(stats.sessions.map(s => dayKey(s.ts)));
  const d = new Date(); let n = 0;
  if (!days.has(dayKey(d))) d.setDate(d.getDate() - 1);
  while (days.has(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function minutesToday() {
  const k = dayKey(Date.now());
  return Math.round(stats.sessions.filter(s => dayKey(s.ts) === k).reduce((a, s) => a + s.sec, 0) / 60);
}

/* ============================================================
   HRA
   ============================================================ */
/* Výběr otázek: 0 = nové z JSON sad (nejnovější první), 1 = naposledy chybné,
   2 = ještě neviděné vestavěné, 3 = zvládnuté (nejdéle neopakované první) */
function prio(q) {
  const st = stats.questions[q.id];
  if (!st) return (q._rank || 0) > 0 ? 0 : 2;
  return st.lastOk === false ? 1 : 3;
}
function pickQuestions(pool, n) {
  const sorted = shuffle(pool).sort((a, b) => {
    const pa = prio(a), pb = prio(b);
    if (pa !== pb) return pa - pb;
    if (pa === 3) return (stats.questions[a.id].last || 0) - (stats.questions[b.id].last || 0);
    return newKey(b).localeCompare(newKey(a));
  });
  return shuffle(n > 0 ? sorted.slice(0, n) : sorted);
}

function startGame(subject, topicKey, explicitList) {
  const all = QUESTIONS.filter(q => q.subject === subject);
  const qs = all.filter(q => q.type !== 'tip');
  let pool, label, tips = [];
  if (explicitList) { pool = explicitList; label = 'Oprava chyb'; }
  else if (topicKey === 'mix') { pool = qs; label = 'Všechno namíchaně'; }
  else if (topicKey === 'mistakes') { pool = qs.filter(isMistake); label = 'Opakování chyb'; }
  else if (topicKey === 'new') { pool = qs.filter(isNewQ); label = 'Nové otázky'; }
  else {
    const t = getTopics(subject)[Number(topicKey)];
    if (!t) return;
    pool = t.qs; label = t.name;
  }
  const questions = explicitList ? shuffle(explicitList) : pickQuestions(pool, settings.sessionLength);
  if (!questions.length) return;
  if (!explicitList && topicKey !== 'mix' && topicKey !== 'mistakes') {
    const topicsUsed = new Set(questions.map(q => q.topic));
    tips = all.filter(q => q.type === 'tip' && topicsUsed.has(q.topic) && (topicKey !== 'new' || (q._rank || 0) > 0));
  }
  game = {
    subject, topicKey, topicLabel: label, explicitList: explicitList || null,
    queue: [...tips, ...questions], total: questions.length, index: 0,
    startTs: Date.now(), activeMs: 0, runningSince: null, results: [], streak: 0, bestStreak: 0, ended: false,
    summaryJoke: null, summaryJokeRevealed: false,
  };
  currentSubject = subject;
  newQuestionState();
  setScreen('game');
  resumeClock();
  render();
}

const curQ = () => game.queue[game.index];
function newQuestionState() {
  const q = curQ();
  const c = {
    wrong: [], solved: q.type === 'tip', revealed: false, hintShown: false,
    inputValue: '', msg: '', anim: null, flash: null, enter: true, title: '',
  };
  if (q.type === 'abcd') { c.options = q.shuffle === false ? q.options.slice() : shuffle(q.options); c.disabled = new Set(); }
  if (q.type === 'pairs') {
    c.left = shuffle(q.pairs.map((p, i) => ({ t: p[0], i })));
    c.right = shuffle(q.pairs.map((p, i) => ({ t: p[1], i })));
    c.matched = new Set(); c.sel = null;
  }
  if (q.type === 'order') {
    const tiles = q.words.concat(q.extra).map((t, id) => ({ t, id }));
    let sh = shuffle(tiles), n = 0;
    while (tiles.length > 1 && n++ < 15 && sh.slice(0, q.words.length).map(x => x.t).join('|') === q.words.join('|')) sh = shuffle(tiles);
    c.tiles = sh; c.chosen = [];
  }
  if (q.type === 'fill') {
    // dílky 0..n-1 = správná slova (dílek i patří na místo i), další jsou zmatení
    const answers = q.blanks.map(b => b.answer);
    const decoys = q.blanks.flatMap(b => b.bad).concat(q.extra).filter((w, i, a) => a.indexOf(w) === i && !answers.includes(w));
    c.tiles = shuffle(answers.concat(decoys).map((t, id) => ({ t, id })));
    c.slots = q.blanks.map(() => null);   // id dílku na daném místě
    c.locked = new Set(); c.bad = new Set(); c.active = null; c.fails = 0;
  }
  if (q.type === 'map') { c.wrongIds = new Set(); c.rightId = null; }
  game.cur = c;
  if (q.type === 'tip') sfx.tip();
}

/* --- ABCD --- */
function chooseOption(i) {
  const c = game.cur, q = curQ();
  if (c.solved || c.disabled.has(i)) return;
  const val = c.options[i];
  if (val === q.correct) { c.solved = true; onSolved(); return; }
  c.disabled.add(i); c.wrong.push(val);
  c.anim = { type: 'shake', idx: i }; c.msg = pick(TRY_AGAIN);
  if (q.hint) c.hintShown = true;
  sfx.wrong(); render();
}

/* --- Spojování dvojic --- */
function tapPair(side, pos) {
  const c = game.cur, q = curQ();
  if (c.solved) return;
  const list = side === 'L' ? c.left : c.right;
  const item = list[pos];
  if (!item || c.matched.has(item.i)) return;
  if (side === 'L' && q.subject === 'aj') speak(item.t, SUBJECTS.aj.lang);
  if (!c.sel || c.sel.side === side) {
    c.sel = (c.sel && c.sel.pos === pos) ? null : { side, pos };
    c.flash = null; c.msg = ''; sfx.tick(); render(); return;
  }
  const lpos = side === 'L' ? pos : c.sel.pos, rpos = side === 'R' ? pos : c.sel.pos;
  const L = c.left[lpos], R = c.right[rpos];
  c.sel = null;
  if (L.i === R.i) {
    c.matched.add(L.i); c.flash = { ok: true, l: lpos, r: rpos }; c.msg = '';
    if (c.matched.size === q.pairs.length) { c.solved = true; onSolved(); return; }
    sfx.match(); render();
  } else {
    c.wrong.push(`${L.t} → ${R.t}`); c.flash = { ok: false, l: lpos, r: rpos }; c.msg = pick(TRY_AGAIN);
    if (q.hint) c.hintShown = true;
    sfx.wrong(); render();
  }
}

/* --- Skládání z dílků --- */
function tapTile(id) {
  const c = game.cur;
  if (c.solved) return;
  const k = c.chosen.indexOf(id);
  if (k >= 0) c.chosen.splice(k, 1); else c.chosen.push(id);
  c.msg = ''; sfx.tick(); render();
}
const orderText = (q, c) => c.chosen.map(id => c.tiles.find(t => t.id === id).t).join(q.joiner);

/* --- Doplňování slov do věty --- */
const fillTile = (c, id) => c.tiles.find(t => t.id === id);
function placeInSlot(id, i) {                       // dílek id → místo i; slovo, které tam bylo, se vrátí mezi dílky (nebo se prohodí)
  const c = game.cur;
  if (c.solved || c.locked.has(i) || id == null) return;
  const from = c.slots.indexOf(id), old = c.slots[i];
  if (from >= 0) c.slots[from] = old;
  c.slots[i] = id; c.active = null; c.msg = '';
  sfx.tick(); render();
}
function tapBankTile(id) {
  const c = game.cur;
  if (c.solved || c.slots.includes(id)) return;
  const free = c.slots.map((s, i) => (s == null && !c.locked.has(i) ? i : -1)).filter(i => i >= 0);
  const target = c.active != null && !c.locked.has(c.active) ? c.active : free[0];
  if (target == null) { c.msg = 'Všechna místa jsou plná – klepni na slovo ve větě a vrátí se zpět.'; render(); return; }
  placeInSlot(id, target);
}
function tapSlot(i) {
  const c = game.cur;
  if (c.solved || c.locked.has(i)) return;
  if (c.slots[i] != null) { c.slots[i] = null; c.active = i; }
  else c.active = c.active === i ? null : i;
  c.msg = ''; sfx.tick(); render();
}
function checkFill() {
  const c = game.cur, q = curQ();
  if (c.slots.some(s => s == null)) { c.anim = { type: 'shake' }; c.msg = 'Nejdřív doplň všechna místa 🙂'; render(); return; }
  const norm = t => String(t).trim().toLocaleLowerCase('cs');
  const bad = [];
  c.slots.forEach((id, i) => { if (!c.locked.has(i) && norm(fillTile(c, id).t) !== norm(q.blanks[i].answer)) bad.push(i); });
  if (!bad.length) { c.solved = true; onSolved(); return; }
  c.fails++; sfx.wrong();
  bad.forEach(i => c.wrong.push(fillTile(c, c.slots[i]).t));
  if (q.hint) c.hintShown = true;
  if (c.fails >= MAX_TRIES) {
    c.slots = q.blanks.map((b, i) => i); c.locked = new Set(c.slots);
    c.solved = true; c.revealed = true; onSolved(); return;
  }
  c.slots.forEach((id, i) => { if (!bad.includes(i)) c.locked.add(i); });   // správná slova zůstanou
  bad.forEach(i => { c.slots[i] = null; });                               // špatná se vrátí mezi dílky
  c.active = bad[0]; c.anim = { type: 'shake' }; c.msg = pick(TRY_AGAIN);
  render();
}

/* --- Slepá mapa --- */
function clickMap(layer, id) {
  const c = game.cur, q = curQ();
  if (!c || c.solved || q.type !== 'map' || layer !== q.layer || c.wrongIds.has(id)) return;
  if (q.target.includes(id)) { c.rightId = id; c.solved = true; onSolved(); return; }
  const item = MAPS[q.map][layer][id];
  c.wrongIds.add(id); c.wrong.push(item.name || id);
  if (q.hint) c.hintShown = true;
  sfx.wrong();
  if (c.wrong.length >= MAX_TRIES) { c.rightId = q.target[0]; c.solved = true; c.revealed = true; onSolved(); return; }
  c.anim = { type: 'shake' }; c.msg = `${pick(TRY_AGAIN)} (to je ${item.name || id})`;
  render();
}

/* --- Přetahování (myš i dotyk): zdroj má data-drag, cíl data-drop --- */
let drag = null, suppressClick = { id: '', until: 0 };
function onDrop(src, dst) {
  const c = game && game.cur;
  if (!c || c.solved) return;
  const [sk, sa, sb] = src.split(':'), [dk, da, db] = dst.split(':');
  if (sk === 'pair' && dk === 'pair') {
    if (sa === da) return;                                    // dvojice se spojují z různých sloupců
    c.sel = { side: sa, pos: Number(sb) }; tapPair(da, Number(db));
  } else if (sk === 'tile' && dk === 'blank') placeInSlot(Number(sa), Number(da));
  else if (sk === 'blank' && dk === 'blank') placeInSlot(c.slots[Number(sa)], Number(da));
  else if (sk === 'blank' && dk === 'bank') { c.slots[Number(sa)] = null; c.active = Number(sa); c.msg = ''; sfx.tick(); render(); }
}
function endDrag() {
  if (!drag) return;
  if (drag.ghost) drag.ghost.remove();
  drag.el.classList.remove('dnd-src');
  document.querySelectorAll('.dnd-over').forEach(n => n.classList.remove('dnd-over'));
  drag = null;
}
document.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const el = e.target.closest('[data-drag]');
  if (!el || el.disabled || screen !== 'game' || !game || !game.cur || game.cur.solved || modal) return;
  drag = { el, id: el.dataset.drag, x: e.clientX, y: e.clientY, pid: e.pointerId, ghost: null };
});
document.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.pid) return;
  if (!drag.ghost) {
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 10) return;
    const r = drag.el.getBoundingClientRect(), g = drag.el.cloneNode(true);
    g.removeAttribute('data-action'); g.removeAttribute('data-drag'); g.removeAttribute('data-drop'); g.classList.add('dnd-ghost');
    g.style.width = r.width + 'px'; g.style.minHeight = r.height + 'px';
    document.body.appendChild(g); drag.ghost = g; drag.el.classList.add('dnd-src');
  }
  drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
  document.querySelectorAll('.dnd-over').forEach(n => n.classList.remove('dnd-over'));
  const over = document.elementFromPoint(e.clientX, e.clientY), t = over && over.closest('[data-drop]');
  if (t && t !== drag.el) t.classList.add('dnd-over');
  e.preventDefault();
});
document.addEventListener('pointerup', e => {
  if (!drag || e.pointerId !== drag.pid) return;
  const d = drag, moved = !!d.ghost;
  const over = moved ? document.elementFromPoint(e.clientX, e.clientY) : null, t = over && over.closest('[data-drop]');
  endDrag();
  if (!moved) return;                                         // jen klepnutí – zpracuje ho běžný click
  suppressClick = { id: d.id, until: Date.now() + 400 };
  if (t && t.dataset.drop !== d.id) onDrop(d.id, t.dataset.drop);
});
document.addEventListener('pointercancel', endDrag);

/* --- Kontrola psaní a skládání --- */
function normAns(s, q) {
  let t = String(s).normalize('NFC').trim();
  if (!q.caseSensitive) t = t.toLocaleLowerCase('cs');
  t = t.replace(/[’‘`´]/g, "'").replace(/\s+/g, ' ');
  if (q.unit) {
    const u = q.caseSensitive ? q.unit : q.unit.toLocaleLowerCase('cs');
    if (t.endsWith(u)) t = t.slice(0, -u.length).trim();
  }
  return t.replace(/[.!?]+$/, '').trim();
}
function asNumber(t) { const c = String(t).replace(/\s/g, '').replace(',', '.'); return /^-?\d+(\.\d+)?$/.test(c) ? parseFloat(c) : null; }
function isCorrectText(q, val) {
  const a = normAns(val, q), an = asNumber(a);
  return q.correct.some(c => {
    const b = normAns(c, q);
    if (a === b) return true;
    const bn = asNumber(b);
    return an !== null && bn !== null && Math.abs(an - bn) < 1e-9;
  });
}
function checkAnswer() {
  const c = game.cur, q = curQ();
  if (c.solved) return;
  if (q.type === 'fill') { checkFill(); return; }
  let val;
  if (q.type === 'order') {
    if (!c.chosen.length) { c.anim = { type: 'shake' }; c.msg = 'Nejdřív klepni na dílky dole 🙂'; render(); return; }
    val = orderText(q, c);
  } else {
    const inp = document.getElementById('answer');
    val = inp ? inp.value : c.inputValue;
    c.inputValue = val;
    if (!val.trim()) { c.anim = { type: 'shake' }; c.msg = 'Nejdřív něco napiš 🙂'; render(); return; }
  }
  if (isCorrectText(q, val)) { c.solved = true; onSolved(); return; }
  c.wrong.push(val.trim()); sfx.wrong();
  if (q.hint) c.hintShown = true;
  if (c.wrong.length >= MAX_TRIES) { c.solved = true; c.revealed = true; onSolved(); return; }
  c.anim = { type: 'shake' }; c.msg = pick(TRY_AGAIN);
  render();
}

function onSolved() {
  const c = game.cur, q = curQ();
  const first = c.wrong.length === 0 && !c.revealed;
  if (first) { game.streak++; game.bestStreak = Math.max(game.bestStreak, game.streak); } else game.streak = 0;
  game.results.push({ q, wrong: c.wrong.slice(), revealed: c.revealed, first });
  recordAnswer(q, c.wrong, c.revealed);
  c.title = c.revealed ? 'Nevadí, příště to dáš!' : (first ? pick(PRAISE) : pick(AFTER_FIX));
  c.msg = ''; c.sel = null;
  if (c.revealed) sfx.wrong(); else sfx.correct();
  render();
}

/* Vtip je odměna za celý blok: aspoň JOKE_BLOCK úkolů a z nich aspoň 90 % napoprvé správně.
   Oprava chyb (vracející se otázky) vtip nespouští, ani jedna opravená odpověď sama o sobě. */
function jokeBlock(g) { return !g.explicitList && g.topicKey !== 'mistakes' && g.total >= JOKE_BLOCK; }
function jokeEarned(g) {
  if (!settings.jokes || !JOKES.length || !jokeBlock(g)) return false;
  return g.results.length >= g.total && g.results.filter(r => r.first).length / g.total >= JOKE_RATIO;
}

function nextStep() {
  if (!game || !game.cur.solved) return;
  game.index++;
  if (game.index >= game.queue.length) {
    endSession(true);
    if (jokeEarned(game)) game.summaryJoke = nextJoke();
    setScreen('summary');
    sfx.finish();
    render();
    return;
  }
  newQuestionState();
  render();
}

/* ============================================================
   NAVIGACE (tlačítko Zpět na Androidu)
   ============================================================ */
function ensureHistory() { try { if (!(history.state && history.state.app)) history.pushState({ app: 1 }, ''); } catch (e) {} }
function setScreen(s) { screen = s; if (s !== 'home' && s !== 'loading') ensureHistory(); }
window.addEventListener('popstate', () => {
  if (screen === 'home' || screen === 'loading') { if (modal) { modal = null; render(); } return; }
  if (modal) { modal = null; ensureHistory(); render(); return; }
  if (screen === 'game' && game && !game.ended) { ensureHistory(); modal = { type: 'quit' }; render(); return; }
  if (screen === 'summary') { setScreen('subject'); render(); return; }
  screen = 'home'; render();
});

/* ============================================================
   VYKRESLOVÁNÍ
   ============================================================ */
function render() {
  let html = '';
  switch (screen) {
    case 'loading': html = `<div class="min-h-screen flex items-center justify-center"><div class="text-7xl bob">🦊</div></div>`; break;
    case 'home': html = renderHome(); break;
    case 'subject': html = renderSubject(); break;
    case 'game': html = renderGame(); break;
    case 'summary': html = renderSummary(); break;
    case 'parent': html = renderParent(); break;
  }
  html += renderModal();
  const same = lastScreen === screen, y = window.scrollY;
  $app.innerHTML = html;
  try { window.scrollTo(0, same ? y : 0); } catch (e) {}
  lastScreen = screen;
  afterRender();
}

function afterRender() {
  $app.querySelectorAll('img[data-fallback]').forEach(img => {
    const fallback = () => { const d = document.createElement('div'); d.className = 'text-8xl leading-none'; d.textContent = img.dataset.fallback; img.replaceWith(d); };
    img.addEventListener('error', fallback, { once: true });
    if (img.complete && img.naturalWidth === 0 && img.getAttribute('src')) fallback();
  });
  if (modal && modal.type === 'gate') {
    const g = document.getElementById('gate'); if (g) g.focus();
    modal.err = false;
  } else if (screen === 'game' && game && game.cur && !modal) {
    const inp = document.getElementById('answer');
    if (inp && !game.cur.solved) {
      try { inp.focus({ preventScroll: true }); } catch (e) { inp.focus(); }
      if (game.cur.wrong.length) inp.select();
    }
  }
  if (screen === 'summary' && game && !game.confettiDone) {
    game.confettiDone = true;
    const pct = game.total ? game.results.filter(r => r.first).length / game.total : 0;
    if (pct >= 0.7) confetti();
  }
  if (game && game.cur) { game.cur.anim = null; game.cur.flash = null; game.cur.enter = false; }
}

function confetti() {
  const colors = ['#ef4444', '#3b82f6', '#f97316', '#22c55e', '#eab308', '#a855f7', '#ec4899'];
  for (let i = 0; i < 70; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.background = pick(colors);
    el.style.animationDuration = (2 + Math.random() * 2.5) + 's';
    el.style.animationDelay = (Math.random() * 0.6) + 's';
    el.style.transform = `rotate(${Math.random() * 360}deg)`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 5500);
  }
}

/* ---------- Úvodní obrazovka ---------- */
function renderHome() {
  const h = new Date().getHours();
  const hello = h < 10 ? 'Dobré ráno!' : h < 18 ? 'Ahoj!' : 'Dobrý večer!';
  const streak = dayStreak(), today = minutesToday();
  const tiles = Object.entries(SUBJECTS).map(([key, s]) => {
    const qs = QUESTIONS.filter(q => q.subject === key && q.type !== 'tip');
    const done = qs.filter(isMastered).length, fresh = qs.filter(isNewQ).length;
    const pct = qs.length ? Math.round(done / qs.length * 100) : 0;
    return `
      <button data-action="subject" data-subject="${key}" ${qs.length ? '' : 'disabled'}
        class="btn3d relative overflow-hidden rounded-3xl p-4 sm:p-6 text-left text-white flex flex-col justify-between aspect-square sm:aspect-[4/3] disabled:opacity-50"
        style="background:${s.color};--shadow:${s.dark}">
        <span class="absolute -right-5 -bottom-8 text-[7rem] sm:text-[9rem] opacity-20 select-none pointer-events-none leading-none">${s.emoji}</span>
        ${fresh ? `<span class="absolute top-3 right-3 px-2.5 py-1 rounded-full bg-white text-xs sm:text-sm font-extrabold wiggle" style="color:${s.dark}">🆕 ${fresh}</span>` : ''}
        <span class="text-5xl sm:text-6xl leading-none">${s.emoji}</span>
        <span class="relative">
          <span class="block font-extrabold text-xl sm:text-2xl leading-tight">${s.name}</span>
          <span class="mt-2 block h-2.5 rounded-full bg-white/30 overflow-hidden"><span class="block h-full bg-white rounded-full" style="width:${pct}%"></span></span>
          <span class="mt-1 block text-xs sm:text-sm font-bold opacity-90">${qs.length ? `${done} z ${qs.length} zvládnuto` : 'Zatím žádné otázky'}</span>
        </span>
      </button>`;
  }).join('');
  return `
  <div class="min-h-screen flex flex-col fade">
    <div class="max-w-3xl w-full mx-auto px-4 pt-6 sm:pt-10 flex-1">
      <div class="flex items-center gap-4">
        <div class="text-6xl sm:text-7xl bob select-none">🦊</div>
        <div class="bubble relative bg-white rounded-2xl border-2 border-gray-200 px-4 py-3 font-extrabold text-gray-700 text-lg sm:text-xl">
          ${hello} Co si dnes procvičíme?
        </div>
      </div>
      <div class="flex gap-2 mt-5 flex-wrap">
        <span class="px-3 py-1.5 rounded-full bg-white border-2 border-gray-200 font-extrabold text-orange-500">🔥 ${streak} ${plural(streak, 'den', 'dny', 'dní')} v řadě</span>
        <span class="px-3 py-1.5 rounded-full bg-white border-2 border-gray-200 font-extrabold text-sky-600">⏱️ dnes ${today} min</span>
        ${settings.jokes ? `<span class="px-3 py-1.5 rounded-full bg-white border-2 border-gray-200 font-extrabold text-purple-600">🎁 vtip za ${Math.round(JOKE_BLOCK * JOKE_RATIO)} z ${JOKE_BLOCK} napoprvé</span>` : ''}
      </div>
      <div class="grid grid-cols-2 gap-3 sm:gap-5 mt-6">${tiles}</div>
    </div>
    <footer class="max-w-3xl w-full mx-auto px-4 py-6 flex items-center justify-between text-gray-500">
      <button data-action="parent-open" class="font-extrabold px-3 py-2 rounded-xl hover:bg-gray-200/60">👨‍👩‍👧 Pro rodiče</button>
      <button data-action="toggle-sound" class="font-extrabold px-3 py-2 rounded-xl hover:bg-gray-200/60">${settings.sound ? '🔊 Zvuk' : '🔇 Bez zvuku'}</button>
    </footer>
  </div>`;
}

/* ---------- Výběr tématu ---------- */
function renderSubject() {
  const s = SUBJECTS[currentSubject];
  const all = QUESTIONS.filter(q => q.subject === currentSubject);
  const qs = all.filter(q => q.type !== 'tip');
  const topics = getTopics(currentSubject);
  const mistakes = qs.filter(isMistake).length, fresh = qs.filter(isNewQ).length;
  const n = settings.sessionLength;
  const typeIcons = t => [...new Set(t.qs.map(q => ({ abcd: '🔘', input: '⌨️', pairs: '🔗', order: '🧩', fill: '✍️', map: '🗺️' }[q.type])))].join('');
  const topicCards = topics.map((t, i) => {
    const done = t.qs.filter(isMastered).length, pct = Math.round(done / t.qs.length * 100);
    const hasTip = all.some(q => q.type === 'tip' && q.topic === t.name);
    const isNewTopic = t.qs.some(isNewQ);
    return `
      <button data-action="start" data-topic="${i}" class="btn3d w-full bg-white rounded-2xl border-2 ${isNewTopic ? 'border-amber-300' : 'border-gray-200'} p-4 text-left flex items-center gap-4" style="--shadow:${isNewTopic ? '#fcd34d' : '#e5e7eb'}">
        <span class="shrink-0 w-12 h-12 rounded-xl flex items-center justify-center text-xl font-extrabold text-white" style="background:${s.color}">${i + 1}</span>
        <span class="flex-1 min-w-0">
          <span class="flex items-center gap-2">
            <span class="font-extrabold text-lg text-gray-800 truncate">${esc(t.name)}</span>
            ${isNewTopic ? '<span class="shrink-0 text-[11px] font-extrabold px-2 py-0.5 rounded-full bg-amber-400 text-white">NOVÉ</span>' : ''}
          </span>
          <span class="block text-sm font-bold text-gray-400">${t.qs.length} ${plural(t.qs.length, 'úkol', 'úkoly', 'úkolů')} ${typeIcons(t)}${hasTip ? ' · 💡 s trikem' : ''}</span>
          <span class="mt-2 block h-2 rounded-full bg-gray-100 overflow-hidden"><span class="block h-full rounded-full" style="width:${pct}%;background:${s.color}"></span></span>
        </span>
        <span class="text-2xl text-gray-300">›</span>
      </button>`;
  }).join('');
  return `
  <div class="min-h-screen fade">
    <div class="text-white" style="background:${s.color}">
      <div class="max-w-2xl mx-auto px-4 pt-4 pb-8">
        <button data-action="home" class="font-extrabold text-white/90 hover:text-white px-2 py-1 -ml-2 rounded-lg">← Zpět</button>
        <div class="flex items-center gap-4 mt-3">
          <span class="text-6xl leading-none">${s.emoji}</span>
          <div>
            <h1 class="text-3xl font-extrabold leading-tight">${s.name}</h1>
            <p class="font-bold opacity-90">${qs.filter(isMastered).length} z ${qs.length} úkolů zvládnuto</p>
          </div>
        </div>
      </div>
    </div>
    <div class="max-w-2xl mx-auto px-4 -mt-5 pb-10 space-y-3">
      ${fresh ? `
      <button data-action="start" data-topic="new" class="btn3d w-full rounded-2xl p-5 flex items-center gap-4 text-left bg-amber-400 text-white" style="--shadow:#d97706">
        <span class="text-4xl wiggle">🆕</span>
        <span class="flex-1"><span class="block font-extrabold text-xl">Nové úkoly</span>
        <span class="block font-bold opacity-90 text-sm">${fresh} ${plural(fresh, 'nový úkol čeká', 'nové úkoly čekají', 'nových úkolů čeká')} – začni tady!</span></span>
        <span class="text-2xl">▶</span>
      </button>` : ''}
      <button data-action="start" data-topic="mix" class="btn3d w-full rounded-2xl p-5 text-white flex items-center gap-4 text-left" style="background:${s.dark};--shadow:#00000040">
        <span class="text-4xl">🎲</span>
        <span class="flex-1"><span class="block font-extrabold text-xl">Všechno namíchaně</span>
        <span class="block font-bold opacity-80 text-sm">${n > 0 ? Math.min(n, qs.length) : qs.length} úkolů ze všech témat, nejnovější a chybné přednostně</span></span>
        <span class="text-2xl">▶</span>
      </button>
      ${mistakes ? `
      <button data-action="start" data-topic="mistakes" class="btn3d w-full rounded-2xl p-4 bg-rose-50 border-2 border-rose-200 flex items-center gap-4 text-left" style="--shadow:#fecdd3">
        <span class="text-3xl">🔁</span>
        <span class="flex-1"><span class="block font-extrabold text-lg text-rose-700">Opravit moje chyby</span>
        <span class="block font-bold text-rose-600/80 text-sm">${mistakes} ${plural(mistakes, 'úkol čeká', 'úkoly čekají', 'úkolů čeká')} na opravu</span></span>
      </button>` : ''}
      <h2 class="pt-3 font-extrabold text-gray-400 uppercase tracking-wider text-sm">Témata (nejnovější nahoře)</h2>
      ${topicCards}
    </div>
  </div>`;
}

/* ---------- Herní obrazovka ---------- */
function renderMedia(q, c) {
  if (q.map) return renderMapCard(q, c);
  if (q.imageUrl) {
    return `<div class="mt-5 flex justify-center"><div class="rounded-3xl overflow-hidden border-2 border-gray-200 bg-white w-full max-w-sm aspect-[4/3] flex items-center justify-center">
      <img src="${esc(q.imageUrl)}" alt="${esc(q.imageAlt || '')}" data-fallback="${esc(q.emoji || '🖼️')}" class="w-full h-full object-cover"></div></div>`;
  }
  if (q.emoji) return `<div class="mt-5 flex justify-center"><div class="text-7xl sm:text-8xl leading-none select-none">${esc(q.emoji)}</div></div>`;
  return '';
}

/* ---------- Mapa (SVG z data/maps/*.json) ---------- */
const triPath = (x, y, s) => `M${x - s} ${y + s * 0.8}L${x} ${y - s}L${x + s} ${y + s * 0.8}Z`;
function renderMapCard(q, c) {
  const m = MAPS[q.map];
  if (!m) return '';
  const isMapQ = q.type === 'map';
  const interactive = isMapQ && c && !c.solved;
  const reveal = !!(c && c.solved);
  const ids = (list, layer) => new Set(list.filter(r => r.startsWith(layer + ':')).map(r => r.slice(layer.length + 1)));
  const HL = { regions: ids(q.highlight, 'regions'), rivers: ids(q.highlight, 'rivers'), points: ids(q.highlight, 'points') };
  const SH = { rivers: ids(q.show, 'rivers'), points: ids(q.show, 'points') };
  const shown = layer => {
    const out = new Set([...HL[layer], ...SH[layer]]);
    if (isMapQ && q.layer === layer) {
      if (q.candidates) q.candidates.forEach(i => out.add(i));
      else { const kind = layer === 'points' ? (m.points[q.target[0]] || {}).kind : null; Object.keys(m[layer]).forEach(i => { if (!kind || m.points[i].kind === kind) out.add(i); }); }
    }
    return [...out].filter(i => m[layer][i]);
  };
  const state = (layer, id) => {
    if (isMapQ && q.layer === layer && c) { if (c.rightId === id) return 'ok'; if (c.wrongIds.has(id)) return 'bad'; }
    return HL[layer].has(id) ? 'hl' : '';
  };
  const act = (layer, id) => `data-action="mapclick" data-layer="${layer}" data-id="${esc(id)}"`;
  const canClick = (layer, st) => interactive && q.layer === layer && st !== 'bad';
  const k = window.innerWidth < 640 ? 1.7 : 1;      // značky na telefonu zvětšíme
  const labels = [];

  const regions = Object.entries(m.regions).map(([id, r]) => {
    const st = state('regions', id), click = canClick('regions', st);
    if (q.labels || (reveal && (st === 'ok' || st === 'hl'))) labels.push(`<text class="lbl sm" x="${r.cx}" y="${r.cy}">${esc(r.short || r.name)}</text>`);
    return `<path class="reg${click ? ' click' : ''} ${st}" ${click ? act('regions', id) : ''} d="${esc(r.d)}"/>`;
  }).join('');

  const rivers = shown('rivers').map(id => {
    const r = m.rivers[id], st = state('rivers', id), d = esc(r.d);
    if (reveal || q.type === 'tip') labels.push(`<text class="lbl sm rv" x="${r.lx}" y="${r.ly}">${esc(r.name)}</text>`);
    return canClick('rivers', st)
      ? `<g class="rgrp" ${act('rivers', id)}><path class="rhit" d="${d}"/><path class="river ${st}" d="${d}"/></g>`
      : `<path class="river ${st}" d="${d}"/>`;
  }).join('');

  const points = shown('points').map(id => {
    const p = m.points[id], st = state('points', id);
    const mark = p.kind === 'city' ? `<circle class="pt ${st}" cx="${p.x}" cy="${p.y}" r="${(p.capital ? 6.5 : 5.5) * k}"/>`
      : `<path class="pt ${p.kind === 'range' ? 'range' : 'peak'} ${st}" d="${triPath(p.x, p.y, (p.kind === 'range' ? 9 : 7) * k)}"/>`;
    if (reveal || q.type === 'tip') labels.push(`<text class="lbl sm" x="${p.x}" y="${p.y - 11 * k}">${esc(p.name)}</text>`);
    return canClick('points', st)
      ? `<g class="pgrp" ${act('points', id)}><circle class="phit" cx="${p.x}" cy="${p.y}" r="${17 * k}"/>${mark}</g>` : mark;
  }).join('');

  const notes = Object.values(m.regions).filter(r => r.note).map(r => `${r.short || r.name} ${r.note}`);
  const showNote = notes.length && (q.labels || HL.regions.size || (isMapQ && q.layer === 'regions'));
  return `<div class="mt-5 map-card mx-auto ${c && c.anim && isMapQ ? 'shake' : ''}" style="max-width:44rem">
    <svg class="cz-map" viewBox="${esc(m.viewBox)}" role="img" aria-label="${esc(m.name || 'Mapa')}">${regions}${rivers}${points}${labels.join('')}</svg>
    ${showNote ? `<div class="map-legend">${esc(notes.join(' · '))}</div>` : ''}</div>`;
}

function renderAbcd(q, c) {
  const short = c.options.every(o => o.length <= 14);
  return `<div class="mt-6 grid gap-3 ${short ? 'grid-cols-2' : 'grid-cols-1'}">` + c.options.map((o, i) => {
    const isWrong = c.disabled.has(i), isRight = c.solved && o === q.correct;
    let cls = 'bg-white border-gray-200 text-gray-800', shadow = '#e5e7eb', badgeCls = 'border-gray-200 text-gray-400', mark = LETTERS[i] || '•';
    if (isWrong) { cls = 'bg-red-50 border-red-300 text-red-400 opacity-80'; shadow = '#fca5a5'; badgeCls = 'border-red-300 text-red-500 bg-white'; mark = '✗'; }
    else if (isRight) { cls = 'bg-green-100 border-green-500 text-green-800'; shadow = '#22c55e'; badgeCls = 'border-green-500 text-white bg-green-500'; mark = '✓'; }
    else if (c.solved) { cls = 'bg-white border-gray-200 text-gray-400 opacity-60'; }
    const anim = c.anim && c.anim.idx === i ? 'shake' : '';
    return `<button data-action="option" data-i="${i}" ${isWrong || c.solved ? 'disabled' : ''}
      class="btn3d ${anim} w-full min-h-[64px] flex items-center gap-3 rounded-2xl border-2 px-4 py-3 text-left text-lg sm:text-xl font-extrabold ${cls}" style="--shadow:${shadow}">
      <span class="shrink-0 w-9 h-9 rounded-xl border-2 flex items-center justify-center text-base font-extrabold ${badgeCls}">${mark}</span>
      <span class="flex-1 ${isWrong ? 'line-through' : ''}">${esc(o)}</span></button>`;
  }).join('') + `</div>`;
}

function renderPairs(q, c) {
  const col = (side, arr) => arr.map((it, pos) => {
    const matched = c.matched.has(it.i);
    const sel = c.sel && c.sel.side === side && c.sel.pos === pos;
    const fl = c.flash && (side === 'L' ? c.flash.l === pos : c.flash.r === pos);
    let cls = 'bg-white border-gray-200 text-gray-800', sh = '#e5e7eb', anim = '';
    if (matched) { cls = 'bg-green-50 border-green-200 text-green-600 opacity-50'; sh = '#dcfce7'; }
    if (sel) { cls = 'bg-sky-50 border-sky-400 text-sky-700'; sh = '#7dd3fc'; }
    if (fl && c.flash.ok) { cls = 'bg-green-100 border-green-500 text-green-800'; sh = '#22c55e'; anim = 'pop'; }
    if (fl && !c.flash.ok) { cls = 'bg-red-50 border-red-400 text-red-600'; sh = '#fca5a5'; anim = 'shake'; }
    const dnd = matched || c.solved ? '' : `data-drag="pair:${side}:${pos}" data-drop="pair:${side}:${pos}"`;
    return `<button data-action="pair" data-side="${side}" data-pos="${pos}" ${matched || c.solved ? 'disabled' : dnd}
      class="btn3d dnd ${anim} w-full min-h-[60px] rounded-2xl border-2 px-2 sm:px-3 py-3 text-base sm:text-xl font-extrabold text-center leading-tight ${cls}" style="--shadow:${sh}">${esc(it.t)}</button>`;
  }).join('');
  const left = q.pairs.length - c.matched.size;
  return `
    <div class="mt-6 grid grid-cols-2 gap-3 sm:gap-5">
      <div class="space-y-3">${col('L', c.left)}</div>
      <div class="space-y-3">${col('R', c.right)}</div>
    </div>
    <p class="mt-4 text-center text-sm font-bold text-gray-400">${c.solved ? 'Všechny dvojice spojené! 🎉' : `Klepni na jedno slovo a pak na jeho dvojici, nebo ho přetáhni. Zbývá ${left} ${plural(left, 'dvojice', 'dvojice', 'dvojic')}.`}</p>`;
}

function renderOrder(q, c) {
  const letters = q.joiner === '';
  const size = letters ? 'min-w-[48px] px-3 py-2 text-2xl' : 'px-3 py-2 text-lg sm:text-xl';
  const chosen = c.chosen.map(id => c.tiles.find(t => t.id === id));
  let zone = 'border-gray-300 bg-white';
  if (c.solved) zone = c.revealed ? 'border-red-400 bg-red-50' : 'border-green-500 bg-green-50';
  else if (c.wrong.length) zone = 'border-red-300 bg-white';
  const tile = t => `<button data-action="tile" data-id="${t.id}" ${c.solved ? 'disabled' : ''}
    class="btn3d ${size} rounded-xl border-2 border-gray-200 bg-white font-extrabold text-gray-800" style="--shadow:#e5e7eb">${esc(t.t)}</button>`;
  const ghost = t => `<span class="${size} rounded-xl bg-gray-200 font-extrabold text-transparent select-none">${esc(t.t)}</span>`;
  return `
    <div class="mt-6 min-h-[80px] rounded-2xl border-2 border-dashed ${zone} p-3 flex flex-wrap gap-2 items-center ${letters ? 'justify-center' : ''} ${c.anim ? 'shake' : ''}">
      ${chosen.length ? chosen.map(tile).join('') : `<span class="w-full text-center text-gray-300 font-bold">Klepej na dílky dole ⬇️</span>`}
    </div>
    <div class="mt-5 flex flex-wrap gap-2 justify-center">${c.tiles.map(t => c.chosen.includes(t.id) ? ghost(t) : tile(t)).join('')}</div>
    ${renderAttempts(c)}`;
}

function renderInput(q, c, s) {
  const numeric = q.correct.every(a => asNumber(normAns(a, q)) !== null);
  let state = c.wrong.length ? 'border-red-300' : 'border-gray-200';
  if (c.solved) state = c.revealed ? 'border-red-400 bg-red-50 text-red-700' : 'border-green-500 bg-green-50 text-green-800';
  return `
    <div class="mt-6 flex items-center gap-3 ${c.anim ? 'shake' : ''}">
      <input id="answer" type="text" inputmode="${numeric ? 'numeric' : 'text'}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done"
        value="${esc(c.inputValue)}" ${c.solved ? 'disabled' : ''} placeholder="${numeric ? '?' : 'Napiš odpověď…'}"
        class="ans w-full min-w-0 text-3xl font-extrabold text-center rounded-2xl border-2 px-4 py-4 bg-white placeholder-gray-300 ${state}" style="--focus:${s.color}">
      ${q.unit ? `<span class="shrink-0 text-2xl font-extrabold text-gray-500">${esc(q.unit)}</span>` : ''}
    </div>
    ${renderAttempts(c)}`;
}

function renderFill(q, c) {
  const slot = i => {
    const id = c.slots[i], t = id == null ? null : fillTile(c, id);
    const free = !c.solved && !c.locked.has(i);
    let cls = 'slot';
    if (c.solved) cls += c.revealed ? ' reveal' : ' ok';
    else if (c.locked.has(i)) cls += ' ok';
    else if (t) cls += ' filled';
    if (free && c.active === i) cls += ' active';
    if (free && t) cls += ' dnd';
    return `<button data-action="blank" data-i="${i}" ${free ? `data-drop="blank:${i}"` : 'disabled'} ${free && t ? `data-drag="blank:${i}"` : ''} class="${cls}">${t ? esc(t.t) : '&nbsp;'}</button>`;
  };
  const sentence = q.parts.map((p, i) => rich(p) + (i < q.blanks.length ? slot(i) : '')).join('');
  const bank = c.tiles.map(t => c.slots.includes(t.id)
    ? `<span class="px-4 py-2 rounded-xl bg-gray-200 text-lg sm:text-xl font-extrabold text-transparent select-none">${esc(t.t)}</span>`
    : `<button data-action="bank" data-id="${t.id}" data-drag="tile:${t.id}" ${c.solved ? 'disabled' : ''}
        class="btn3d dnd rounded-xl border-2 border-gray-200 bg-white px-4 py-2 text-lg sm:text-xl font-extrabold text-gray-800" style="--shadow:#e5e7eb">${esc(t.t)}</button>`).join('');
  const attempts = c.wrong.length ? `<div class="mt-3 flex flex-wrap gap-2 items-center"><span class="text-sm font-bold text-gray-400">Tohle nepasovalo:</span>
    ${c.wrong.map(w => `<span class="px-3 py-1 rounded-full bg-red-50 border border-red-200 text-red-500 font-bold line-through">${esc(w)}</span>`).join('')}
    ${!c.solved ? `<span class="text-sm font-bold text-gray-400">· pokus ${c.fails + 1} ze ${MAX_TRIES}</span>` : ''}</div>` : '';
  return `
    <div class="mt-6 bg-white rounded-3xl border-2 border-gray-200 p-4 sm:p-5 fill-text ${c.anim ? 'shake' : ''}">${sentence}</div>
    <div data-drop="bank" class="mt-5 min-h-[64px] rounded-2xl border-2 border-dashed border-gray-300 p-3 flex flex-wrap gap-2 justify-center items-center">${bank}</div>
    <p class="mt-3 text-center text-sm font-bold text-gray-400">Klepni na slovo, nebo ho přetáhni na správné místo ve větě.</p>
    ${attempts}`;
}

function renderAttempts(c) {
  if (!c.wrong.length) return '';
  return `<div class="mt-3 flex flex-wrap gap-2 items-center"><span class="text-sm font-bold text-gray-400">Tvoje pokusy:</span>
    ${c.wrong.map(w => `<span class="px-3 py-1 rounded-full bg-red-50 border border-red-200 text-red-500 font-bold line-through">${esc(w)}</span>`).join('')}
    ${!c.solved ? `<span class="text-sm font-bold text-gray-400">· pokus ${c.wrong.length + 1} ze ${MAX_TRIES}</span>` : ''}</div>`;
}

function renderGame() {
  const g = game, q = curQ(), c = g.cur, s = SUBJECTS[g.subject];
  const pct = Math.round((g.index + (c.solved ? 1 : 0)) / g.queue.length * 100);
  const qNum = g.queue.slice(0, g.index + 1).filter(x => x.type !== 'tip').length;

  const header = `
    <header class="sticky top-0 z-10 bg-[#f7f7f5] flex items-center gap-3 py-4">
      <button data-action="quit" class="w-10 h-10 shrink-0 rounded-xl text-2xl font-extrabold text-gray-400 hover:bg-gray-200/60" aria-label="Ukončit">✕</button>
      <div class="flex-1 h-5 bg-gray-200 rounded-full overflow-hidden">
        <div class="h-full rounded-full transition-all duration-500 ease-out" style="width:${pct}%;background:${GREEN}">
          <div class="h-1.5 mx-2 mt-1 rounded-full bg-white/40"></div>
        </div>
      </div>
      <div class="shrink-0 font-extrabold ${g.streak >= 2 ? 'text-orange-500' : 'text-gray-300'}" title="Správně v řadě">🔥 ${g.streak}</div>
    </header>`;

  if (q.type === 'tip') {
    return `
    <div class="min-h-screen flex flex-col max-w-2xl mx-auto px-4">
      ${header}
      <main class="flex-1 flex flex-col items-center text-center pt-4 pb-40 ${c.enter ? 'pop' : ''}">
        <div class="text-sm font-extrabold uppercase tracking-wider" style="color:${s.dark}">💡 Trik na zapamatování</div>
        <div class="text-7xl my-4 leading-none">${esc(q.emoji || '💡')}</div>
        <h2 class="text-2xl sm:text-3xl font-extrabold text-gray-800">${rich(q.question)}</h2>
        ${q.map ? `<div class="w-full">${renderMapCard(q, c)}</div>` : ''}
        <div class="mt-5 w-full bg-white rounded-3xl border-2 p-5 sm:p-6 text-lg sm:text-xl text-left leading-relaxed text-gray-700" style="border-color:${s.color}40">${rich(q.text || '')}</div>
      </main>
      ${bottomBar(`<button data-action="next" class="btn3d w-full rounded-2xl py-4 text-xl font-extrabold text-white uppercase tracking-wide" style="background:${s.color};--shadow:${s.dark}">Jasně, jdeme na to! 👉</button>`)}
    </div>`;
  }

  const sayText = speakTextFor(q);
  const speakBtn = sayText ? `<button data-action="speak" class="btn3d shrink-0 w-12 h-12 rounded-2xl text-2xl text-white" style="background:${s.color};--shadow:${s.dark}" aria-label="Přečíst nahlas">🔊</button>` : '';
  const code = q.code ? `<div class="mt-5 flex justify-center"><pre class="bg-white border-2 border-gray-200 rounded-2xl px-8 py-4 text-3xl sm:text-4xl font-mono font-bold text-gray-700 leading-snug">${esc(q.code)}</pre></div>` : '';

  let hint = '';
  if (q.hint) {
    if (c.hintShown) hint = `<div class="mt-4 flex gap-2 items-start bg-yellow-50 border-2 border-yellow-200 text-yellow-900 rounded-2xl px-4 py-3 font-bold pop"><span>💡</span><span>${rich(q.hint)}</span></div>`;
    else if (!c.solved) hint = `<button data-action="hint" class="mt-4 font-extrabold text-yellow-700 hover:bg-yellow-50 px-3 py-2 -ml-3 rounded-xl">💡 Potřebuju nápovědu</button>`;
  }

  let answers = '';
  if (q.type === 'abcd') answers = renderAbcd(q, c);
  else if (q.type === 'pairs') answers = renderPairs(q, c);
  else if (q.type === 'order') answers = renderOrder(q, c);
  else if (q.type === 'fill') answers = renderFill(q, c);
  else if (q.type === 'map') answers = '';   // odpovídá se kliknutím do mapy (renderMedia)
  else answers = renderInput(q, c, s);

  const msg = c.msg && !c.solved ? `<div class="mt-4 text-center font-extrabold text-red-500 pop">${esc(c.msg)}</div>` : '';

  let bottom = '';
  if (!c.solved) {
    if (q.type === 'input' || q.type === 'order' || q.type === 'fill') {
      bottom = bottomBar(`<button data-action="check" class="btn3d w-full rounded-2xl py-4 text-xl font-extrabold text-white uppercase tracking-wide" style="background:${GREEN};--shadow:${GREEN_DARK}">Zkontrolovat</button>`);
    }
  } else {
    bottom = feedbackSheet(q, c);
  }

  return `
  <div class="min-h-screen flex flex-col max-w-2xl mx-auto px-4">
    ${header}
    <main class="flex-1 pt-2 pb-72 ${c.enter ? 'pop' : ''}">
      <div class="text-sm font-extrabold uppercase tracking-wider" style="color:${s.dark}">${s.emoji} ${esc(q.topic)} · ${qNum}/${g.total}</div>
      <div class="mt-2 flex items-start gap-3">
        <h2 class="flex-1 text-2xl sm:text-3xl font-extrabold text-gray-800 leading-snug">${rich(q.question)}</h2>
        ${speakBtn}
      </div>
      ${renderMedia(q, c)}
      ${code}
      ${answers}
      ${msg}
      ${hint}
    </main>
    ${bottom}
  </div>`;
}

function bottomBar(inner) {
  return `<div class="fixed inset-x-0 bottom-0 z-20 bg-white border-t-2 border-gray-200" style="padding-bottom:env(safe-area-inset-bottom)">
    <div class="max-w-2xl mx-auto px-4 py-4">${inner}</div></div>`;
}

function answerText(q) {
  if (q.type === 'abcd') return q.correct;
  if (q.type === 'pairs') return q.pairs.map(p => `${p[0]} = ${p[1]}`).join(' · ');
  if (q.type === 'order') return q.correct[0];
  if (q.type === 'fill') return q.parts.map((p, i) => plain(p) + (i < q.blanks.length ? q.blanks[i].answer : '')).join('').replace(/\s+/g, ' ').trim();
  if (q.type === 'map') { const t = (MAPS[q.map] && MAPS[q.map][q.layer][q.target[0]]) || {}; return t.name || q.target[0]; }
  if (q.type === 'tip') return '';
  return q.correct[0] + (q.unit ? ' ' + q.unit : '');
}

function feedbackSheet(q, c) {
  const ok = !c.revealed, first = ok && c.wrong.length === 0;
  const btn = `<button data-action="next" class="btn3d sm:w-56 w-full rounded-2xl py-4 text-xl font-extrabold text-white uppercase tracking-wide" style="background:${ok ? GREEN : '#ef4444'};--shadow:${ok ? GREEN_DARK : '#b91c1c'}">Pokračovat</button>`;
  return `
  <div class="fixed inset-x-0 bottom-0 z-20 sheet ${ok ? 'bg-green-100' : 'bg-red-100'}" style="padding-bottom:env(safe-area-inset-bottom)">
    <div class="max-w-2xl mx-auto px-4 py-4 sm:py-6 flex flex-col sm:flex-row sm:items-center gap-4">
      <div class="flex-1 flex gap-3 items-start">
        <div class="shrink-0 w-12 h-12 rounded-full bg-white flex items-center justify-center text-2xl">${ok ? (first ? '🎉' : '✅') : '🤔'}</div>
        <div class="min-w-0">
          <div class="text-2xl font-extrabold ${ok ? 'text-green-700' : 'text-red-700'}">${esc(c.title)}</div>
          ${!ok ? `<div class="font-extrabold text-red-700 mt-1">Správně je: <span class="px-2 py-0.5 bg-white rounded-lg">${esc(answerText(q))}</span></div>` : ''}
          ${first && game.streak >= 3 ? `<div class="font-extrabold text-orange-600 mt-1">🔥 ${game.streak} správně v řadě!</div>` : ''}
          ${q.explanation ? `<div class="mt-1 font-semibold ${ok ? 'text-green-900' : 'text-red-900'}">${rich(q.explanation)}</div>` : ''}
        </div>
      </div>
      ${btn}
    </div>
  </div>`;
}

/* ---------- Shrnutí ---------- */
function renderSummary() {
  const g = game, s = SUBJECTS[g.subject];
  const res = g.results, total = res.length, first = res.filter(r => r.first).length;
  const pct = total ? Math.round(first / total * 100) : 0;
  const stars = pct >= 90 ? 3 : pct >= 60 ? 2 : 1;
  const sec = Math.round(g.activeMs / 1000);
  const missed = res.filter(r => !r.first);
  const title = pct === 100 ? 'Bez jediné chyby! 🌟' : pct >= 80 ? 'Skvělá práce!' : pct >= 50 ? 'Dobrá práce!' : 'Hlavně že trénuješ! 💪';
  const mascot = pct >= 80 ? '🦊🏆' : pct >= 50 ? '🦊👍' : '🦊💪';
  const card = (icon, label, value, color) => `
    <div class="rounded-2xl border-2 overflow-hidden" style="border-color:${color}">
      <div class="text-white text-xs font-extrabold uppercase tracking-wider py-1.5 text-center" style="background:${color}">${label}</div>
      <div class="bg-white py-3 text-center text-2xl font-extrabold" style="color:${color}">${icon} ${value}</div>
    </div>`;
  const j = g.summaryJoke;
  const joke = j ? `
    <div class="mt-6 rounded-3xl border-2 border-purple-200 bg-purple-50 p-5 text-center">
      <div class="text-xs font-extrabold uppercase tracking-wider text-purple-500">🎁 Vtip za odměnu</div>
      <p class="mt-2 text-xl font-extrabold text-gray-800">${esc(j.q)}</p>
      ${j.a ? (g.summaryJokeRevealed ? `<p class="mt-3 text-xl font-extrabold text-purple-700 pop">${esc(j.a)} 😂</p>`
        : `<button data-action="summary-joke" class="btn3d mt-4 rounded-2xl px-6 py-3 font-extrabold text-white" style="background:#a855f7;--shadow:#7e22ce">Prozradit pointu 😄</button>`) : ''}
    </div>` : (settings.jokes && JOKES.length && jokeBlock(g) ? `
    <p class="mt-6 text-center font-bold text-purple-500">🎁 Vtip za odměnu dostaneš, když zvládneš aspoň ${Math.round(JOKE_BLOCK * JOKE_RATIO)} z ${JOKE_BLOCK} úkolů napoprvé.</p>` : '');
  return `
  <div class="min-h-screen max-w-2xl mx-auto px-4 py-8 fade">
    <div class="text-center">
      <div class="text-7xl bob">${mascot}</div>
      <div class="mt-4 text-5xl tracking-widest">${[1, 2, 3].map(i => `<span style="${i <= stars ? '' : 'filter:grayscale(1);opacity:.25'}">⭐</span>`).join('')}</div>
      <h1 class="mt-3 text-3xl sm:text-4xl font-extrabold text-gray-800">${title}</h1>
      <p class="mt-1 font-bold text-gray-500">${s.emoji} ${esc(g.topicLabel)}</p>
    </div>
    <div class="mt-6 grid grid-cols-3 gap-3">
      ${card('🎯', 'Napoprvé', `${first}/${total}`, GREEN)}
      ${card('⏱️', 'Čas', fmtClock(sec), '#1cb0f6')}
      ${card('🔥', 'Série', g.bestStreak, '#ff9600')}
    </div>
    ${joke}
    ${missed.length ? `
      <h2 class="mt-8 font-extrabold text-gray-400 uppercase tracking-wider text-sm">Na tohle si dej pozor</h2>
      <div class="mt-3 space-y-2">
        ${missed.map(r => `
          <div class="bg-white rounded-2xl border-2 border-gray-200 p-4">
            <div class="font-extrabold text-gray-800">${rich(r.q.question)}${r.q.type === 'fill' ? `<div class="mt-1 font-bold text-gray-600">${esc(plain(r.q.parts.join('___')).replace(/\s+/g, ' '))}</div>` : ''}${r.q.code ? ` <span class="font-mono">${esc(r.q.code.split('\n').slice(0, 2).join(' ').replace(/\s+/g, ' '))}</span>` : ''}</div>
            <div class="mt-1 font-bold text-green-700">✓ ${esc(answerText(r.q))}</div>
            ${r.wrong.length ? `<div class="text-sm font-bold text-red-400">✗ ${r.wrong.map(esc).join(', ')}</div>` : ''}
          </div>`).join('')}
      </div>` : ''}
    <div class="mt-8 grid gap-3">
      ${missed.length ? `<button data-action="retry-mistakes" class="btn3d w-full rounded-2xl py-4 text-lg font-extrabold text-white uppercase tracking-wide" style="background:#ff9600;--shadow:#cc7800">🔁 Procvičit chyby (${missed.length})</button>` : ''}
      <button data-action="play-again" class="btn3d w-full rounded-2xl py-4 text-lg font-extrabold text-white uppercase tracking-wide" style="background:${GREEN};--shadow:${GREEN_DARK}">Hrát znovu</button>
      <div class="grid grid-cols-2 gap-3">
        <button data-action="back-subject" class="btn3d rounded-2xl py-3 font-extrabold bg-white border-2 border-gray-200 text-gray-600" style="--shadow:#e5e7eb">Jiné téma</button>
        <button data-action="home" class="btn3d rounded-2xl py-3 font-extrabold bg-white border-2 border-gray-200 text-gray-600" style="--shadow:#e5e7eb">Domů</button>
      </div>
    </div>
  </div>`;
}

/* ---------- Modální okna ---------- */
function renderModal() {
  if (!modal) return '';
  const wrap = inner => `<div data-action="modal-backdrop" class="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4 fade">
    <div class="bg-white rounded-3xl p-6 w-full max-w-sm text-center pop">${inner}</div></div>`;
  if (modal.type === 'quit') {
    const left = game ? game.total - game.results.length : 0;
    return wrap(`
      <div class="text-6xl">🦊</div>
      <h3 class="text-2xl font-extrabold mt-2 text-gray-800">Opravdu chceš skončit?</h3>
