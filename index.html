      <p class="text-gray-500 font-bold mt-2">${left > 0 ? `Zbývá ti už jen ${left} ${plural(left, 'úkol', 'úkoly', 'úkolů')}!` : 'Už jsi skoro v cíli!'}</p>
      <div class="mt-6 grid gap-3">
        <button data-action="modal-close" class="btn3d w-full rounded-2xl py-4 text-lg font-extrabold text-white uppercase" style="background:${GREEN};--shadow:${GREEN_DARK}">Pokračovat</button>
        <button data-action="quit-confirm" class="w-full rounded-2xl py-3 font-extrabold text-red-500 hover:bg-red-50 uppercase">Skončit</button>
      </div>`);
  }
  if (modal.type === 'gate') {
    return wrap(`
      <div class="text-5xl">🔒</div>
      <h3 class="text-2xl font-extrabold mt-2 text-gray-800">Jen pro rodiče</h3>
      <p class="text-gray-500 font-bold mt-1">Kolik je <span class="text-gray-800">${modal.a} + ${modal.b}</span>?</p>
      <input id="gate" type="text" inputmode="numeric" autocomplete="off"
        class="ans mt-4 w-full text-3xl font-extrabold text-center rounded-2xl border-2 px-4 py-3 ${modal.err ? 'shake border-red-400' : 'border-gray-200'}" style="--focus:#1cb0f6">
      <div class="mt-4 grid grid-cols-2 gap-3">
        <button data-action="modal-close" class="btn3d rounded-2xl py-3 font-extrabold bg-white border-2 border-gray-200 text-gray-600" style="--shadow:#e5e7eb">Zrušit</button>
        <button data-action="gate-submit" class="btn3d rounded-2xl py-3 font-extrabold text-white" style="background:#1cb0f6;--shadow:#1899d6">Vstoupit</button>
      </div>`);
  }
  return '';
}

/* ---------- Rodičovský panel ---------- */
function renderParent() {
  const sess = stats.sessions;
  const totalSec = Object.values(stats.timeBySubject).reduce((a, b) => a + b, 0);
  const answered = sess.reduce((a, x) => a + (x.answered || 0), 0);
  const firstTry = sess.reduce((a, x) => a + (x.firstTry || 0), 0);
  const activeDays = new Set(sess.map(x => dayKey(x.ts))).size;
  const qById = new Map(QUESTIONS.map(q => [q.id, q]));
  const section = (title, body) => `<section class="bg-white rounded-3xl border-2 border-gray-200 p-5"><h2 class="font-extrabold text-lg text-gray-800 mb-3">${title}</h2>${body}</section>`;
  const kpi = (label, value) => `<div class="bg-gray-50 rounded-2xl p-3"><div class="text-xs font-extrabold uppercase tracking-wider text-gray-400">${label}</div><div class="text-2xl font-extrabold text-gray-800">${value}</div></div>`;
  const chip = (n, cur, label) => `<button data-action="${label.action}" data-n="${n}"
    class="px-4 py-2 rounded-xl font-extrabold border-2 ${cur === n ? 'bg-sky-500 border-sky-500 text-white' : 'bg-white border-gray-200 text-gray-600'}">${label.text}</button>`;

  // posledních 14 dní
  const days = [];
  for (let i = 13; i >= 0; i--) {
    const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - i);
    const k = dayKey(d);
    days.push({ d, sec: sess.filter(x => dayKey(x.ts) === k).reduce((a, x) => a + x.sec, 0) });
  }
  const maxSec = Math.max(300, ...days.map(x => x.sec));
  const chart = `
    <div class="flex items-end gap-1 h-28">${days.map(x => `<div class="flex-1 h-full flex items-end" title="${x.d.getDate()}. ${x.d.getMonth() + 1}.: ${fmtDur(x.sec)}">
      <div class="w-full rounded-t-md ${x.sec ? 'bg-green-500' : 'bg-gray-100'}" style="height:${Math.max(4, x.sec / maxSec * 100)}%"></div></div>`).join('')}</div>
    <div class="flex gap-1 mt-1">${days.map(x => `<div class="flex-1 text-center text-[10px] font-bold text-gray-400">${x.d.getDate()}.</div>`).join('')}</div>`;

  const subjRows = Object.entries(SUBJECTS).map(([k, s]) => {
    const ss = sess.filter(x => x.subject === k);
    const a = ss.reduce((acc, x) => acc + (x.answered || 0), 0), f = ss.reduce((acc, x) => acc + (x.firstTry || 0), 0);
    const qs = QUESTIONS.filter(q => q.subject === k && q.type !== 'tip');
    return `<tr class="border-t border-gray-100">
      <td class="py-2 pr-2 font-extrabold" style="color:${s.dark}">${s.emoji} ${s.name}</td>
      <td class="py-2 px-2 text-right font-bold">${fmtDur(stats.timeBySubject[k] || 0)}</td>
      <td class="py-2 px-2 text-right font-bold">${ss.length}</td>
      <td class="py-2 px-2 text-right font-bold">${a ? Math.round(f / a * 100) + ' %' : '–'}</td>
      <td class="py-2 pl-2 text-right font-bold">${qs.filter(isMastered).length}/${qs.length}</td></tr>`;
  }).join('');

  const missed = Object.entries(stats.questions).filter(([, st]) => st.fails > 0)
    .sort((a, b) => (b[1].wrong - a[1].wrong) || (b[1].fails - a[1].fails) || ((b[1].lastFail || 0) - (a[1].lastFail || 0)))
    .slice(0, 20);
  const missedHtml = missed.length ? `<div class="space-y-2">${missed.map(([id, st]) => {
    const q = qById.get(id), subj = SUBJECTS[st.subject] || { emoji: '❓' };
    return `<div class="rounded-2xl border-2 border-gray-100 p-3">
      <div class="flex items-start gap-2">
        <span>${subj.emoji}</span>
        <div class="flex-1 min-w-0">
          <div class="font-bold text-gray-800">${esc(st.q || id)}</div>
          <div class="text-xs font-bold text-gray-400 mt-0.5">${esc(st.topic || '')} · chyb celkem ${st.wrong} · napoprvé ${st.firstTry}/${st.seen}</div>
          ${q ? `<div class="text-sm font-bold text-green-700 mt-1">✓ ${esc(answerText(q))}</div>` : ''}
          ${st.lastWrong && st.lastWrong.length ? `<div class="text-sm font-bold text-red-500">✗ ${st.lastWrong.map(esc).join(', ')}</div>` : ''}
        </div>
        <span class="shrink-0 text-xs font-extrabold px-2 py-1 rounded-full ${st.lastOk ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}">${st.lastOk ? 'už umí' : 'procvičit'}</span>
      </div></div>`;
  }).join('')}</div>` : `<p class="text-gray-400 font-bold">Zatím žádné chyby. 🎉</p>`;

  const recent = sess.slice(-12).reverse();
  const recentHtml = recent.length ? `<div class="overflow-x-auto"><table class="w-full text-sm"><tbody>${recent.map(x => {
    const s = SUBJECTS[x.subject] || { emoji: '❓' }, d = new Date(x.ts);
    return `<tr class="border-t border-gray-100">
      <td class="py-2 pr-2 font-bold text-gray-500 whitespace-nowrap">${d.toLocaleDateString('cs-CZ', { weekday: 'short', day: 'numeric', month: 'numeric' })} ${d.toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' })}</td>
      <td class="py-2 px-2 font-bold">${s.emoji} ${esc(x.topic)}${x.completed ? '' : ' <span class="text-xs text-gray-400">(nedokončeno)</span>'}</td>
      <td class="py-2 px-2 text-right font-extrabold whitespace-nowrap">${x.firstTry}/${x.answered}</td>
      <td class="py-2 pl-2 text-right font-bold text-gray-500 whitespace-nowrap">${fmtDur(x.sec)}</td></tr>`;
  }).join('')}</tbody></table></div>` : `<p class="text-gray-400 font-bold">Zatím žádné testy.</p>`;

  const lengthBtns = [5, 10, 15, 20, 0].map(n => chip(n, settings.sessionLength, { action: 'set-length', text: n || 'Vše' })).join('');
  const jokeBtns = [1, 0].map(n => chip(n, settings.jokes ? 1 : 0, { action: 'set-jokes', text: n ? 'Zapnuto' : 'Vypnuto' })).join('');

  const real = QUESTIONS.filter(q => q.type !== 'tip');
  const counts = Object.entries(SUBJECTS).map(([k, s]) => `${s.emoji} ${real.filter(q => q.subject === k).length}`).join(' · ');
  const byType = ['abcd', 'input', 'pairs', 'order', 'fill', 'map'].map(t => `${{ abcd: '🔘 výběr', input: '⌨️ psaní', pairs: '🔗 dvojice', order: '🧩 skládání', fill: '✍️ doplňování', map: '🗺️ mapa' }[t]} ${real.filter(q => q.type === t).length}`).join(' · ');
  const fileRows = SOURCES.files.length ? SOURCES.files.map(f => `<li>${esc(f.name)}: ${f.missing ? '<span class="text-red-500">soubor nenalezen</span>' : `${f.count} položek${f.errors ? ` <span class="text-red-500">(${f.errors} chybných přeskočeno)</span>` : ''}`}</li>`).join('')
    : `<li>žádný questions.json ${/^https?:$/.test(location.protocol) ? 'nenalezen' : '(načítá se jen na webu, ne ze souboru v počítači)'}</li>`;
  const msg = parentMsg ? `<div class="mt-3 rounded-2xl px-4 py-3 font-bold ${parentMsg.type === 'ok' ? 'bg-green-50 text-green-800' : 'bg-red-50 text-red-700'}">${esc(parentMsg.text)}</div>` : '';

  return `
  <div class="min-h-screen fade">
    <div class="sticky top-0 z-10 bg-[#f7f7f5]/95 backdrop-blur border-b-2 border-gray-200">
      <div class="max-w-3xl mx-auto px-4 py-3 flex items-center gap-3">
        <button data-action="home" class="font-extrabold text-gray-500 px-2 py-1 -ml-2 rounded-lg hover:bg-gray-200/60">← Zpět</button>
        <h1 class="font-extrabold text-xl text-gray-800">👨‍👩‍👧 Rodičovský panel</h1>
      </div>
    </div>
    <div class="max-w-3xl mx-auto px-4 py-6 space-y-4">
      ${section('Přehled', `
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
          ${kpi('Celkový čas', fmtDur(totalSec))}
          ${kpi('Testů', sess.length)}
          ${kpi('Napoprvé správně', answered ? Math.round(firstTry / answered * 100) + ' %' : '–')}
          ${kpi('Dní s učením', activeDays)}
        </div>
        <div class="mt-5 text-xs font-extrabold uppercase tracking-wider text-gray-400 mb-2">Minuty za posledních 14 dní</div>
        ${chart}
        <div class="mt-5 overflow-x-auto"><table class="w-full text-sm">
          <thead><tr class="text-xs uppercase tracking-wider text-gray-400"><th class="text-left py-1 pr-2">Předmět</th><th class="text-right px-2">Čas</th><th class="text-right px-2">Testy</th><th class="text-right px-2">Napoprvé</th><th class="text-right pl-2">Zvládnuto</th></tr></thead>
          <tbody>${subjRows}</tbody></table></div>`)}
      ${section('Kde dítě nejčastěji chybuje', missedHtml)}
      ${section('Poslední testy', recentHtml)}
      ${section('Nastavení', `
        <div class="font-bold text-gray-600 mb-2">Počet úkolů v jednom testu</div>
        <div class="flex flex-wrap gap-2">${lengthBtns}</div>
        <div class="font-bold text-gray-600 mt-5 mb-2">🎁 Vtip za odměnu</div>
        <div class="flex flex-wrap gap-2">${jokeBtns}</div>
        <p class="text-sm text-gray-400 font-bold mt-2">Vtip se ukáže na konci bloku ${JOKE_BLOCK} a více úkolů, když dítě odpoví napoprvé správně aspoň na ${Math.round(JOKE_RATIO * 100)} % z nich (${Math.round(JOKE_BLOCK * JOKE_RATIO)} z ${JOKE_BLOCK}). Opravování chyb vtip nespouští. Vtipy se neopakují, dokud se nevystřídají všechny (${JOKES.length}). Při testu kratším než ${JOKE_BLOCK} úkolů se vtip nedává.</p>
        <p class="text-sm text-gray-400 font-bold mt-3">Pořadí úkolů: nejdřív nové z JSON sad (nejnovější první), pak naposledy chybné, pak ostatní neviděné a nakonec ty, které dítě už umí a dlouho je neopakovalo.</p>`)}
      ${section('Otázky', `
        <p class="font-bold text-gray-600">Načteno ${real.length} úkolů (${counts})</p>
        <p class="text-sm font-bold text-gray-400">${byType}</p>
        <p class="text-sm font-bold text-gray-400 mt-1">Vestavěné: ${SOURCES.builtin} · importované v tomto prohlížeči: ${SOURCES.imported} · nové neviděné: ${real.filter(isNewQ).length}</p>
        <ul class="text-sm font-bold text-gray-500 mt-1 list-disc pl-5">${fileRows}</ul>
        ${SOURCES.maps.length ? `<p class="text-sm font-bold text-gray-500 mt-2">Mapy: ${SOURCES.maps.map(m => m.ok ? `🗺️ ${esc(m.name)}` : `<span class="text-red-500">${esc(m.name)} (nenalezena)</span>`).join(', ')}</p>` : ''}
        ${SOURCES.warnings.length ? `<details class="mt-2 text-sm font-bold text-red-500"><summary class="cursor-pointer">${SOURCES.warnings.length} ${plural(SOURCES.warnings.length, 'úkol byl vyřazen', 'úkoly byly vyřazeny', 'úkolů bylo vyřazeno')} (chyba v mapě)</summary><ul class="list-disc pl-5 mt-1">${SOURCES.warnings.slice(0, 30).map(w => `<li>${esc(w)}</li>`).join('')}</ul></details>` : ''}
        <div class="mt-4 font-bold text-gray-600">Rychlý import (uloží se jen do tohoto prohlížeče)</div>
        <input id="importFile" type="file" accept=".json,application/json" class="mt-2 block w-full text-sm font-bold text-gray-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:font-extrabold file:bg-sky-100 file:text-sky-700">
        <textarea id="importText" rows="5" placeholder='[ { "id": "cj_99", "subject": "cj", "topic": "Vyjmenovaná slova", "type": "input", "question": "Doplň i/y: b_t", "correct": "y" } ]'
          class="mt-2 w-full rounded-2xl border-2 border-gray-200 p-3 font-mono text-sm focus:border-sky-400 outline-none"></textarea>
        <div class="mt-2 flex flex-wrap gap-2">
          <button data-action="import" class="btn3d rounded-xl px-4 py-2 font-extrabold text-white" style="background:#1cb0f6;--shadow:#1899d6">⬆️ Přidat úkoly</button>
          <button data-action="export-questions" class="rounded-xl px-4 py-2 font-extrabold border-2 border-gray-200 text-gray-600 hover:bg-gray-50">⬇️ Stáhnout všechny úkoly</button>
          <button data-action="download-template" class="rounded-xl px-4 py-2 font-extrabold border-2 border-gray-200 text-gray-600 hover:bg-gray-50">📄 Šablona nové sady</button>
          ${SOURCES.imported ? `<button data-action="clear-custom" class="rounded-xl px-4 py-2 font-extrabold border-2 border-red-200 text-red-500 hover:bg-red-50">🗑️ Smazat importované</button>` : ''}
        </div>
        ${msg}
        <details class="mt-4 rounded-2xl bg-gray-50 p-4">
          <summary class="font-extrabold text-gray-600 cursor-pointer">Jak přidávat nové sady přes GitHub</summary>
          <div class="mt-3 text-sm text-gray-600 font-semibold space-y-2">
            <p>Vedle <code>index.html</code> dej soubor <code>questions.json</code> se seznamem sad:</p>
            <pre class="bg-white rounded-xl p-3 overflow-x-auto text-xs">{ "files": [ "sada-2026-10-19.json", "sada-2026-10-26.json" ] }</pre>
            <p>Každá sada je samostatný soubor. Datum v názvu souboru (nebo pole <code>"added"</code>) určuje, co je nejnovější – nová témata se dítěti ukážou nahoře s nálepkou <b>NOVÉ</b> a v namíchaném testu mají přednost.</p>
            <pre class="bg-white rounded-xl p-3 overflow-x-auto text-xs">{ "added": "2026-10-26",
  "questions": [ … ],
  "jokes": [ { "q": "otázka", "a": "pointa" } ] }</pre>
            <ul class="list-disc pl-5 space-y-1">
              <li><code>type</code>: abcd · input · pairs · order · fill · map · tip (trik na zapamatování na začátku tématu)</li>
              <li><code>pairs</code>: <code>[["bed","postel"], ["sofa","pohovka"]]</code> – 2 až 8 dvojic (jdou klikat i přetahovat)</li>
              <li><code>fill</code>: <code>"text": "Vltava teče přes {{Prahu}}.", "extra": ["Brno"]</code> – slova se doplňují z nabídky</li>
              <li><code>map</code>: <code>"map": "cr", "layer": "regions", "target": "jihocesky"</code> – slepá mapa; <code>layer</code> je regions / rivers / points</li>
              <li>Mapu lze přidat i k <code>abcd</code>, <code>input</code>, <code>fill</code> a <code>tip</code>: <code>"map": "cr", "highlight": ["regions:jihocesky"]</code></li>
              <li>Mapy jsou v <code>data/maps/*.json</code> (obrysy krajů, řeky, města a hory). Další mapu stačí přidat tam nebo ji dát do sady jako <code>"maps": { "nazev": { … } }</code>.</li>
              <li><code>order</code>: <code>"correct": "I sleep in my bed"</code>; písmena: <code>"joiner": ""</code>; navíc dílky: <code>"extra": ["on"]</code></li>
              <li>Otázka se stejným <code>id</code> přepíše starší verzi. <code>"replaceBuiltIn": true</code> skryje vestavěné otázky.</li>
            </ul>
          </div>
        </details>`)}
      ${section('Záloha a mazání', `
        <div class="flex flex-wrap gap-2">
          <button data-action="export-stats" class="rounded-xl px-4 py-2 font-extrabold border-2 border-gray-200 text-gray-600 hover:bg-gray-50">⬇️ Stáhnout statistiky</button>
          <button data-action="reset-stats" class="rounded-xl px-4 py-2 font-extrabold border-2 border-red-200 text-red-500 hover:bg-red-50">Vymazat statistiky</button>
        </div>
        <p class="text-sm text-gray-400 font-bold mt-2">Statistiky jsou uložené jen v tomto prohlížeči na tomto zařízení.</p>`)}
    </div>
  </div>`;
}

/* ============================================================
   DATA – import / export
   ============================================================ */
function download(name, obj) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
const cleanQ = q => { const o = {}; Object.keys(q).forEach(k => { if (k[0] !== '_') o[k] = q[k]; }); return o; };
const TEMPLATE = {
  added: '2026-10-26',
  questions: [
    { id: 'aj_zvirata_tip', subject: 'aj', topic: 'Animals', type: 'tip', emoji: '🐾', question: 'Trik na zapamatování', text: '**rabbit** zní jako „rebit“ – králík je **rebel**, co pořád utíká.\n**mouse** – „maus“ jako počítačová **myš**.' },
    { id: 'aj_zvirata_01', subject: 'aj', topic: 'Animals', type: 'pairs', question: 'Spoj zvíře s překladem:', pairs: [['dog', 'pes'], ['cat', 'kočka'], ['rabbit', 'králík'], ['mouse', 'myš']] },
    { id: 'aj_zvirata_02', subject: 'aj', topic: 'Animals', type: 'abcd', emoji: '🐰', question: 'What is this?', options: ['rabbit', 'mouse', 'dog', 'cat'], correct: 'rabbit' },
    { id: 'aj_zvirata_03', subject: 'aj', topic: 'Animals', type: 'input', emoji: '🐭', question: 'Napiš anglicky: myš', correct: 'mouse' },
    { id: 'aj_zvirata_04', subject: 'aj', topic: 'Animals', type: 'order', question: 'Slož větu: Mám psa.', correct: 'I have got a dog', extra: ['cat'] },
    { id: 'cj_novy_01', subject: 'cj', topic: 'Vyjmenovaná slova po L', type: 'order', question: 'Slož slovo z písmen:', correct: 'lyže', joiner: '', extra: ['i'] },
    { id: 'prv_sablona_01', subject: 'prv', topic: 'Ukázka', type: 'fill', question: 'Doplň slova:', text: 'Vltava teče přes {{Prahu}} a ústí do {{Labe}}.', extra: ['Odru'] },
    { id: 'prv_sablona_02', subject: 'prv', topic: 'Ukázka', type: 'map', map: 'cr', layer: 'regions', target: 'jihocesky', question: 'Klikni na Jihočeský kraj.' },
    { id: 'prv_sablona_03', subject: 'prv', topic: 'Ukázka', type: 'abcd', map: 'cr', highlight: ['rivers:vltava'], show: ['rivers:labe', 'rivers:morava'], question: 'Která řeka je zvýrazněná?', options: ['Vltava', 'Labe', 'Morava'], correct: 'Vltava' },
  ],
  jokes: [{ q: 'Proč šel pes do školy?', a: 'Chtěl se naučit štěkat anglicky: woof!' }],
};

async function doImport() {
  const fileEl = document.getElementById('importFile'), textEl = document.getElementById('importText');
  let text = '';
  if (fileEl && fileEl.files && fileEl.files[0]) text = await fileEl.files[0].text();
  else if (textEl) text = textEl.value.trim();
  if (!text) { parentMsg = { type: 'err', text: 'Vyberte JSON soubor nebo vložte text.' }; render(); return; }
  let json;
  try { json = JSON.parse(text); } catch (e) { parentMsg = { type: 'err', text: 'Tohle není platný JSON: ' + e.message }; render(); return; }
  const p = parseQuestionPack(json);
  const added = (json && !Array.isArray(json) && json.added) || todayISO();
  if (!p.questions.length) { parentMsg = { type: 'err', text: 'Nenašla jsem žádný platný úkol. Každý potřebuje id, předmět, zadání a správnou odpověď (u dvojic "pairs").' }; render(); return; }
  const existing = store.get(KEY.custom, null);
  const merged = new Map(((existing && existing.questions) || []).map(q => [q.id, q]));
  p.questions.forEach(q => merged.set(q.id, Object.assign(cleanQ(q), { added: q.added || added })));
  const jokes = ((existing && existing.jokes) || []).concat((json && Array.isArray(json.jokes)) ? json.jokes : []);
  const maps = Object.assign({}, existing && existing.maps, json && !Array.isArray(json) && json.maps);
  store.set(KEY.custom, { replaceBuiltIn: p.replace || !!(existing && existing.replaceBuiltIn), questions: [...merged.values()], jokes, maps });
  await loadQuestions();
  parentMsg = { type: 'ok', text: `Přidáno nebo upraveno ${p.questions.length} ${plural(p.questions.length, 'položka', 'položky', 'položek')}.` + (p.errors ? ` Přeskočeno ${p.errors} (chybí id, předmět, zadání nebo správná odpověď).` : '') };
  render();
}

function gateSubmit() {
  const inp = document.getElementById('gate');
  if (inp && Number(inp.value.trim()) === modal.a + modal.b) { modal = null; parentMsg = null; setScreen('parent'); render(); return; }
  modal = { type: 'gate', a: 11 + Math.floor(Math.random() * 39), b: 11 + Math.floor(Math.random() * 39), err: true };
  render();
}

/* ============================================================
   UDÁLOSTI
   ============================================================ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  if (Date.now() < suppressClick.until && el.dataset.drag === suppressClick.id) return;   // klik na přetahovaný prvek hned po puštění
  const a = el.dataset.action;
  if (a === 'modal-backdrop' && e.target !== el) return;
  unlockAudio();
  switch (a) {
    case 'subject': currentSubject = el.dataset.subject; setScreen('subject'); render(); break;
    case 'home': if (game && !game.ended) endSession(false); screen = 'home'; render(); break;
    case 'back-subject': setScreen('subject'); render(); break;
    case 'start': startGame(currentSubject, el.dataset.topic); break;
    case 'option': chooseOption(Number(el.dataset.i)); break;
    case 'pair': tapPair(el.dataset.side, Number(el.dataset.pos)); break;
    case 'tile': tapTile(Number(el.dataset.id)); break;
    case 'blank': tapSlot(Number(el.dataset.i)); break;
    case 'bank': tapBankTile(Number(el.dataset.id)); break;
    case 'mapclick': clickMap(el.dataset.layer, el.dataset.id); break;
    case 'check': checkAnswer(); break;
    case 'next': nextStep(); break;
    case 'summary-joke': game.summaryJokeRevealed = true; sfx.reward(); render(); break;
    case 'hint': game.cur.hintShown = true; render(); break;
    case 'speak': speak(speakTextFor(curQ()), SUBJECTS[game.subject].lang); break;
    case 'quit': modal = { type: 'quit' }; render(); break;
    case 'quit-confirm': modal = null; endSession(false); setScreen('subject'); render(); break;
    case 'modal-close': modal = null; render(); break;
    case 'modal-backdrop': modal = null; render(); break;
    case 'retry-mistakes': startGame(game.subject, null, game.results.filter(r => !r.first).map(r => r.q)); break;
    case 'play-again': startGame(game.subject, game.topicKey, game.explicitList); break;
    case 'parent-open': modal = { type: 'gate', a: 11 + Math.floor(Math.random() * 39), b: 11 + Math.floor(Math.random() * 39) }; render(); break;
    case 'gate-submit': gateSubmit(); break;
    case 'toggle-sound': settings.sound = !settings.sound; saveSettings(); render(); if (settings.sound) sfx.correct(); break;
    case 'set-length': settings.sessionLength = Number(el.dataset.n); saveSettings(); render(); break;
    case 'set-jokes': settings.jokes = el.dataset.n === '1'; saveSettings(); render(); break;
    case 'import': doImport(); break;
    case 'export-questions': download('vsechny-ukoly.json', { questions: QUESTIONS.map(cleanQ), jokes: JOKES }); break;
    case 'download-template': download(`sada-${todayISO()}.json`, TEMPLATE); break;
    case 'export-stats': download(`statistiky-${todayISO()}.json`, stats); break;
    case 'clear-custom':
      if (confirm('Opravdu smazat všechny importované úkoly z tohoto prohlížeče?')) {
        store.del(KEY.custom); loadQuestions().then(() => { parentMsg = { type: 'ok', text: 'Importované úkoly smazány.' }; render(); });
      }
      break;
    case 'reset-stats':
      if (confirm('Opravdu vymazat všechny statistiky? Tohle nejde vrátit.')) {
        stats = { timeBySubject: {}, sessions: [], questions: {} }; saveStats(); render();
      }
      break;
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'answer' && game && game.cur) game.cur.inputValue = e.target.value;
});

document.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (modal) {
    if (e.key === 'Escape') { modal = null; render(); }
    else if (e.key === 'Enter' && modal.type === 'gate') { e.preventDefault(); gateSubmit(); }
    return;
  }
  if (screen !== 'game' || !game) return;
  const q = curQ(), c = game.cur;
  if (e.key === 'Enter') {
    e.preventDefault();
    if (c.solved) nextStep();
    else if (q.type === 'input' || q.type === 'order' || q.type === 'fill') checkAnswer();
    return;
  }
  if (q.type === 'abcd' && !c.solved && !e.ctrlKey && !e.metaKey && !e.altKey) {
    const i = '1234'.indexOf(e.key);
    if (i >= 0 && i < c.options.length) chooseOption(i);
  }
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden) pauseClock(); else if (screen === 'game') resumeClock();
});
window.addEventListener('pagehide', () => { pauseClock(); if (screen === 'game' && game && !game.ended) endSession(false); });

/* ============================================================
   START
   ============================================================ */
(async function init() {
  render();
  try { await loadQuestions(); } catch (e) { console.error(e); }
  screen = 'home';
  render();
})();
</script>
